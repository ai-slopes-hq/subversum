<!doctype html>
<html lang="ru">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>wavetable: статичные эскизы (рецепт хребтов)</title>
<style>
  html, body { margin: 0; background: #07070C; color: #8a98a0; font: 12px/1.45 ui-monospace, Menlo, Consolas, monospace; }
  #sheet { display: flex; gap: 18px; padding: 18px; align-items: flex-start; width: max-content; }
  figure { margin: 0; }
  figcaption { padding: 10px 2px 0; max-width: 390px; }
  figcaption b { color: #e8e2d0; font-weight: 600; }
  canvas { display: block; width: 390px; height: 844px; border-radius: 16px; }
  body.one #sheet { padding: 0; gap: 0; display: block; width: auto; }
  body.one figcaption { display: none; }
  body.one canvas { width: 100vw; height: 100vh; border-radius: 0; }
</style>
<div id="sheet"></div>
<script>
/* Статичные эскизы wavetable по рецепту хребтов: заслонение линий (hidden-line), одна краска с глубиной, тихая основа, один гладкий цикл на ширину,
   палец это источник: кадр под пальцем набухает и показывает bend и фолд. 64 кадра таблицы = 64 линии. Y = кадр, X = путь до bend.
   ?v=1..3 показывает один вариант на весь экран. */
const N = 64, NP = 360, TAU = Math.PI * 2, DPR = 2, CW = 390, CH = 844;
const rng = a => () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
const R = rng(20261109);
// a smooth table: few partials, a formant that climbs through them, the phase drifts a little from frame to frame so neighbours look alike
const T = new Float32Array(N * NP);
(function () {
  const NH = 9, ph = [], dph = [];
  for (let h = 1; h <= NH; h++) { ph[h] = R() * TAU; dph[h] = (R() - 0.5) * 1.2; }
  for (let k = 0; k < N; k++) {
    const u = k / (N - 1), c = 1.5 * Math.pow(6.5 / 1.5, u); let pk = 1e-9; const row = new Float32Array(NP);
    for (let i = 0; i < NP; i++) {
      let v = 0; const x = i / NP * TAU;
      for (let h = 1; h <= NH; h++) v += Math.pow(h, -1.2) * (1 + 4 * Math.exp(-0.5 * Math.pow((Math.log2(h) - Math.log2(c)) / 0.38, 2))) * Math.sin(h * x + ph[h] * 0.4 + dph[h] * u * 1.5 - TAU * h * 0.45 * u);
      row[i] = v; pk = Math.max(pk, Math.abs(v));
    }
    for (let i = 0; i < NP; i++) T[k * NP + i] = row[i] / pk;
  }
})();
function tv(f, p) {
  p -= Math.floor(p); const x = p * NP, i = x | 0, r = x - i, i2 = (i + 1) % NP; f = Math.max(0, Math.min(N - 1 - 1e-6, f)); const k = f | 0, w = f - k;
  return (T[k * NP + i] * (1 - r) + T[k * NP + i2] * r) * (1 - w) + (T[(k + 1) * NP + i] * (1 - r) + T[(k + 1) * NP + i2] * r) * w;
}
const TH = Math.tanh(1.5), BEND = 0.55, DEPTH = 0.15, FM = 0.7;
// the wave that is heard: the table with a little FM, then the bend, then the fold
const heard = (f, p) => Math.sin(Math.PI * 5 * DEPTH * Math.tanh(1.5 * (0.7 * tv(f, p + FM / TAU * Math.sin(TAU * 2 * p)) + 0.24 * BEND)) / TH);
const FJ = 41.3, FX = 0.58;   // the finger: frame and x (0..1)

// one stack, hidden-line, the same recipe as the ridges world
function stack(g, o) {
  const DY = 10, Y0 = 118, M = 200, A = 15, tw = x => Math.pow(Math.sin(Math.PI * x / CW), 0.55);
  g.save(); g.scale(DPR, DPR); g.fillStyle = o.bg; g.fillRect(0, 0, CW, CH);
  g.lineJoin = 'round';
  for (let j = N - 1; j >= 0; j--) {   // the top of the screen is the last frame; the nearest line is frame 0
    const y = Y0 + (N - 1 - j) * DY, t = j / (N - 1), dj = j - FJ, ws = Math.exp(-dj * dj / 12), pts = [];
    for (let m = 0; m <= M; m++) {
      const x = CW * m / M, p = x / CW, wx = Math.exp(-Math.pow((x - FX * CW) / 120, 2) / 2) * ws;
      const base = tv(j, p), hv = heard(j, p), v = base * (1 - wx) + hv * wx;
      pts.push([x, y - A * tw(x) * v * (1 + 1.1 * wx)]);
    }
    g.beginPath(); pts.forEach((q, i) => i ? g.lineTo(q[0], q[1]) : g.moveTo(q[0], q[1]));
    const edge = new Path2D(); pts.forEach((q, i) => i ? edge.lineTo(q[0], q[1]) : edge.moveTo(q[0], q[1]));
    g.lineTo(CW, CH + 20); g.lineTo(0, CH + 20); g.closePath();
    o.fill(g, y, t, ws); g.fill();
    g.lineWidth = o.lw(ws); g.strokeStyle = o.stroke(t, ws); g.stroke(edge);
  }
  if (o.after) o.after(g);
  g.restore();
}
function mk(title, text, o) {
  const fig = document.createElement('figure'), cv = document.createElement('canvas'), cap = document.createElement('figcaption');
  cv.width = CW * DPR; cv.height = CH * DPR; cap.innerHTML = '<b>' + title + '</b><br>' + text;
  fig.appendChild(cv); fig.appendChild(cap); document.getElementById('sheet').appendChild(fig);
  stack(cv.getContext('2d'), o);
}

// 1: the recipe as it is: one ink, depth in opacity, the lines hide each other
mk('1 · Лёд', 'Рецепт хребтов как есть: одна краска, глубина прозрачностью, линии заслоняют друг друга. Каждая линия это кадр таблицы, один гладкий цикл на ширину. Кадр под пальцем набухает и изогнут bend и фолдом.', {
  bg: '#070C14',
  fill: (g) => { g.fillStyle = '#070C14'; },
  lw: ws => 1.15 + 1.1 * ws,
  stroke: (t, ws) => 'hsla(196,85%,' + (62 + 14 * ws) + '%,' + Math.min(1, (0.22 + 0.78 * (1 - t)) + 0.5 * ws) + ')'
});

// 2: slabs: the same stack as layers of paper in one colour that deepens with distance
mk('2 · Пласты', 'То же, но каждый кадр это пласт: тёмная заливка с градиентом от светлой кромки вниз. Один цвет, который глубже вдали. Читается как слои породы или бумаги, а кадр под пальцем вспыхивает.', {
  bg: '#0B0716',
  fill: (g, y, t, ws) => { const gr = g.createLinearGradient(0, y - 20, 0, y + 70), l = 22 + 22 * (1 - t) + 12 * ws; gr.addColorStop(0, 'hsl(' + (262 + 70 * (1 - t) - 20 * ws) + ',55%,' + l + '%)'); gr.addColorStop(1, '#0B0716'); g.fillStyle = gr; },
  lw: ws => 1.1 + 1.2 * ws,
  stroke: (t, ws) => 'hsla(' + (300 + 50 * (1 - t) - 30 * ws) + ',90%,' + (62 + 18 * ws) + '%,' + Math.min(1, 0.35 + 0.65 * (1 - t) + 0.5 * ws) + ')'
});

// 3: two inks: a cold stack and a warm glow where the finger is
mk('3 · Тепло под пальцем', 'Холодная стопка, а там, где палец, кадр и его соседи теплеют, и под ними вспыхивает тёплое пятно света. Палец не значок поверх картинки, а место, где среда нагрета.', {
  bg: '#08090F',
  fill: (g) => { g.fillStyle = '#08090F'; },
  lw: ws => 1.1 + 1.3 * ws,
  stroke: (t, ws) => ws > 0.06 ? 'hsla(26,95%,' + (62 + 10 * ws) + '%,' + Math.min(1, 0.25 + 0.9 * ws + 0.3 * (1 - t)) + ')' : 'hsla(214,35%,64%,' + (0.18 + 0.6 * (1 - t)) + ')',
  after: g => {
    const x = FX * CW, y = 118 + (N - 1 - FJ) * 10, gr = g.createRadialGradient(x, y, 0, x, y, 170);
    gr.addColorStop(0, 'rgba(255,150,80,.30)'); gr.addColorStop(1, 'rgba(255,150,80,0)'); g.globalCompositeOperation = 'screen'; g.fillStyle = gr; g.fillRect(0, 0, CW, CH); g.globalCompositeOperation = 'source-over';
  }
});

const v = +(/[?&]v=(\d)/.exec(location.search) || [0, 0])[1];
if (v) { document.body.classList.add('one'); [...document.querySelectorAll('figure')].forEach((f, i) => { if (i !== v - 1) f.remove(); }); }
</script>
