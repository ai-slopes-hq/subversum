<meta name="theme-color" content="#000000">
<script>
// the look is picked at random on every launch; ?skin=riso|scope|amber forces one
(function () {
  var all = ['amber', 'riso', 'scope', 'topo', 'matrix', 'mandala', 'ridges', 'clouds', 'vector', 'shepard', 'overtones'], k = all[Math.floor(Math.random() * all.length)];
  try { var q = /[?&]skin=(amber|riso|scope|topo|matrix|mandala|ridges|clouds|vector|shepard|overtones|paper|donut)/.exec(location.search); if (q) k = q[1]; } catch (e) {}
  document.documentElement.setAttribute('data-skin', k);
  var m = document.querySelector('meta[name=theme-color]');
  if (m) m.setAttribute('content', { amber: '#000000', riso: '#14121C', scope: '#020805', topo: '#102528', matrix: '#0B0B0C', paper: '#F7E3D3', donut: '#FBE3D6', mandala: '#0A0A0E', ridges: '#0A0A0E', clouds: '#0A0C12', vector: '#08080C', shepard: '#06030C', overtones: '#06040C' }[k]);
})();
</script>
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">

<title>Subversum</title>
<style>
/* Layout: black screen with one huge round button. The whole screen is the touch target; the tick ring around the button shows the gate level. */
:root {
  --bg: #000000;
  --tick: #2a2621;
  --tick-hi: #5d574d;
  --ink: #f1ece4;
  --accent: #ffab40;
  --hue: 38;               /* patch colour, shifted on every press by every skin */
  color-scheme: dark;
}
* { box-sizing: border-box; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
img, svg { -webkit-user-drag: none; }
html, body { height: 100%; overflow: hidden; }   /* glows bleed past the screen edge; clip them so the page never grows wider than the phone */
body { transition: background-color .45s; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  padding-block: 12px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  -webkit-user-select: none;
  user-select: none;
  -webkit-tap-highlight-color: transparent;
  overscroll-behavior: none;
  touch-action: none;
}
.app {
  height: 100%;
  max-width: 520px;
  margin: 0 auto;
  display: grid;
  grid-template-rows: minmax(0, 1fr);
}
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; margin: 0; }

.stage { container-type: size; display: grid; place-items: center; min-height: 0; }
.dial {
  position: relative;
  width: min(92vw, 360px);
  aspect-ratio: 1;
  width: min(100cqw, 100cqh);
}
.ring { position: absolute; inset: 0; width: 100%; height: 100%; }
.ring line { stroke-linecap: round; transition: stroke .05s; }
.ring .off { stroke: var(--tick); }
.ring .hi { stroke: var(--tick-hi); }
.ring .on { stroke: var(--accent); }

.go {
  position: absolute; inset: 15%;
  border-radius: 50%;
  border: 1px solid var(--tick-hi);
  background: radial-gradient(circle at 50% 35%, #1a1612, #060504 72%);
  color: var(--ink);
  display: grid; place-items: center;
  padding: 0;
  cursor: pointer;
  touch-action: none;
  -webkit-touch-callout: none;
  transition: transform .06s, border-color .1s, color .1s;
}
.go svg {
  width: 32%; height: 32%;
  fill: none; stroke: currentColor; stroke-width: 1.4; stroke-linecap: round; stroke-linejoin: round;
}
.go.down, .go.live { transform: scale(.97); border-color: var(--accent); color: var(--accent); }
.go:focus-visible { outline: 2px solid var(--accent); outline-offset: 4px; }
.go.hit { animation: hit .55s ease-out; }
@keyframes hit {
  0% { box-shadow: 0 0 0 0 color-mix(in srgb, var(--accent) 55%, transparent), inset 0 0 40px color-mix(in srgb, var(--accent) 35%, transparent); }
  100% { box-shadow: 0 0 0 18px transparent, inset 0 0 0 transparent; }
}
.go::after {
  content: ""; position: absolute; inset: 0; border-radius: 50%;
  pointer-events: none; opacity: 0;
  background: radial-gradient(circle at 50% 50%, color-mix(in srgb, var(--accent) var(--ga, 40%), transparent) 0%, transparent 72%);
}
.go.pulse::after { animation: glow .42s ease-out; }
@keyframes glow { 0% { opacity: 1; } 100% { opacity: 0; } }

/* the 16 steps live inside the button as flat wedges: pattern filled in by loudness, the playing step flashes */
.go .steps { position: absolute; inset: 0; width: 100%; height: 100%; }
.w { fill: transparent; stroke: var(--tick); stroke-width: .7; stroke-linejoin: round; transition: stroke .25s; }
.w.n { fill: var(--tick-hi); fill-opacity: var(--o, .3); stroke: var(--tick-hi); }
.wh { fill: var(--accent); stroke: var(--accent); stroke-width: .7; stroke-linejoin: round; opacity: 0; pointer-events: none; }
.wh.hit { animation: wedge .8s ease-out; }
@keyframes wedge { 0% { opacity: 1; } 100% { opacity: 0; } }

/* living background: two soft blobs in the patch colour, steered by the hidden LFOs and kicked by every beat */
.bg {
  position: fixed; inset: -10%; z-index: -1; pointer-events: none;
  background:
    radial-gradient(circle at var(--bx1, 30%) var(--by1, 35%), color-mix(in srgb, var(--accent) 34%, transparent), transparent 46%),
    radial-gradient(circle at var(--bx2, 72%) var(--by2, 68%), color-mix(in srgb, var(--accent) 22%, transparent), transparent 52%);
  opacity: var(--bg-b, 0); transition: opacity .8s;
}
.bg.beat { animation: bgbeat .5s ease-out; }
@keyframes bgbeat { 0% { filter: brightness(1.9); } 100% { filter: brightness(1); } }

/* the dial breathes on every beat; a soft glow behind it drifts with the patch's hidden LFOs */
.dial::before {
  content: ""; position: absolute; inset: -22%; border-radius: 50%; pointer-events: none;
  background: radial-gradient(circle, color-mix(in srgb, var(--accent) 100%, transparent) 0%, transparent 62%);
  opacity: var(--bg-a, 0); transition: opacity .5s;
}
.dial.beat { animation: beat .32s ease-out; }
@keyframes beat { 0% { transform: scale(1.018); } 100% { transform: scale(1); } }
@media (prefers-reduced-motion: reduce) {
  .go.hit { animation: none; }
  .go.pulse::after { animation: none; opacity: .5; }
  .wh.hit { animation: none; opacity: .6; }
  .bg.beat { animation: none; }
  .dial.beat { animation: none; }
}

/* ---------- skins: amber is the base look above; riso and scope override it ---------- */
html[data-skin="scope"] { --sh: calc(var(--hue) * .5 + 100); --bg: hsl(var(--sh) 60% 3%); --tick: hsl(var(--sh) 70% 14%); --tick-hi: hsl(var(--sh) 60% 40%); --ink: hsl(var(--sh) 100% 76%); --accent: hsl(var(--sh) 100% 65%); }
html[data-skin="scope"] body {
  background:
    radial-gradient(circle at 50% 50%, hsl(var(--sh) 60% 5%) 0%, hsl(var(--sh) 60% 3%) 70%, hsl(var(--sh) 60% 2%) 100%);
}
html[data-skin="scope"] body::after {
  content: ""; position: fixed; inset: 0; pointer-events: none; z-index: 5;
  background: repeating-linear-gradient(0deg, rgba(0,0,0,.3) 0, rgba(0,0,0,.3) 1px, transparent 1px, transparent 3px);
  box-shadow: inset 0 0 90px 20px rgba(0,0,0,.75);
}
html[data-skin="scope"] .ring line { display: none; }
html[data-skin="scope"] .ring .wave { display: block; }
html[data-skin="scope"] .go { background: hsl(var(--sh) 80% 4%); border-color: var(--accent); }
html[data-skin="scope"] .go > svg:not(.steps) { filter: drop-shadow(0 0 3px hsl(var(--sh) 100% 65% / .85)); }
html[data-skin="scope"] .bg { opacity: calc(var(--bg-b, 0) * .5); }
.ring .wave { display: none; fill: none; stroke: var(--accent); stroke-width: 1.1; stroke-linejoin: round;
  filter: drop-shadow(0 0 2px var(--accent)); opacity: calc(.4 + .6 * var(--env, 0)); }

html[data-skin="riso"] { --rh: calc(var(--hue) + 302); --rb: calc(var(--rh) + 140); --bg: hsl(var(--rh) 22% 9%); --tick: rgba(20,18,28,.22); --tick-hi: hsl(var(--rh) 100% 65%); --ink: #14121C; --accent: #14121C; }
html[data-skin="riso"] .ring line, html[data-skin="riso"] .bg { display: none; }
html[data-skin="riso"] .go { background: #F2EBDC; border: 2px solid transparent; }
html[data-skin="riso"] .go::after { background: radial-gradient(circle, hsl(var(--rh) 100% 65% / .55) 0%, transparent 72%); }
html[data-skin="riso"] .dial .ring, html[data-skin="riso"] .dial .go { z-index: 1; }
html[data-skin="riso"] .dial::before {
  inset: 7%; border-radius: 50%; background: hsl(var(--rh) 100% 62%); mix-blend-mode: screen; z-index: 0;
  opacity: calc(.6 + .4 * var(--env, 0)); transition: none;
}
html[data-skin="riso"] .dial::after {
  content: ""; position: absolute; inset: 12%; border-radius: 50%; pointer-events: none; z-index: 0;
  transform: translate(4.5%, 4.5%); mix-blend-mode: screen;
  background-image: radial-gradient(circle, hsl(var(--rb) 100% 62%) 1.5px, transparent 1.8px); background-size: 7px 7px;
  box-shadow: inset 0 0 0 2px hsl(var(--rb) 100% 62%);
}
html[data-skin="riso"] body::after {
  content: ""; position: fixed; inset: 0; pointer-events: none; mix-blend-mode: screen; opacity: .3; z-index: 5;
  background-image: url("data:image/svg+xml;utf8,%3Csvg xmlns='http://www.w3.org/2000/svg' width='200' height='200'%3E%3Cfilter id='g'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' seed='7'/%3E%3CfeColorMatrix values='0 0 0 0 .9 0 0 0 0 .85 0 0 0 0 .8 0 0 0 1.1 -.55'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23g)'/%3E%3C/svg%3E");
}

/* ---------- skin motion ---------- */
.ring .ink { display: none; transform-box: fill-box; transform-origin: center; }
.ring .ink.a { fill: hsl(var(--rh, 340) 100% 65%); }
.ring .ink.b { fill: hsl(var(--rb, 220) 100% 62%); }
.ring .ink.rest { opacity: .35; }
.ring .ink.hit { animation: ink .65s cubic-bezier(.2, .9, .3, 1.3); }
@keyframes ink { 0% { fill: #F2EBDC; transform: scale(2.6); } 100% { transform: scale(1); } }
html[data-skin="riso"] .ring .ink { display: block; }
html[data-skin="riso"] .dial::before { transform: scale(calc(.97 + var(--env, 0) * .03 + var(--kick, 0) * .05)); }
html[data-skin="riso"] .dial::after {
  transform: translate(calc(4.5% + var(--jx, 0) * 1%), calc(4.5% + var(--jy, 0) * 1%));
  background-image: radial-gradient(circle, hsl(var(--rb) 100% 62%) calc(1.1px + var(--env, 0) * 1.4px), transparent calc(1.4px + var(--env, 0) * 1.4px));
}
html[data-skin="riso"] body::after { animation: grain .5s steps(1) infinite; }
@keyframes grain {
  0% { background-position: 0 0; } 25% { background-position: -30px 40px; }
  50% { background-position: 50px -20px; } 75% { background-position: -40px -40px; }
}
html[data-skin="scope"] .ring .wave { stroke-width: calc(1.1 + var(--kick, 0) * 1.6); }
html[data-skin="scope"] body::before {
  content: ""; position: fixed; left: 0; right: 0; top: -140px; height: 140px; pointer-events: none; z-index: 4;
  background: linear-gradient(transparent, hsl(var(--sh) 100% 65% / .07), transparent);
  animation: roll 7s linear infinite;
}
@keyframes roll { to { transform: translateY(calc(100vh + 280px)); } }
html[data-skin="scope"] .app { animation: flick 5s steps(1) infinite; }
@keyframes flick { 0%, 100% { opacity: 1; } 47% { opacity: .96; } 48% { opacity: 1; } 91% { opacity: .97; } 92% { opacity: 1; } }
@media (prefers-reduced-motion: reduce) {
  html[data-skin="riso"] body::after, html[data-skin="scope"] body::before, html[data-skin="scope"] .app, .ring .ink.hit { animation: none; }
}

/* ---------- skins with their own full-screen layer: topo, matrix, paper, donut ---------- */
.skinsvg { display: none; position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: -1; }
html[data-skin="topo"] .skinsvg, html[data-skin="matrix"] .skinsvg, html[data-skin="paper"] .skinsvg, html[data-skin="donut"] .skinsvg { display: block; }
html[data-skin="topo"] .bg, html[data-skin="matrix"] .bg, html[data-skin="paper"] .bg, html[data-skin="donut"] .bg,
html[data-skin="topo"] .dial::before, html[data-skin="matrix"] .dial::before, html[data-skin="paper"] .dial::before, html[data-skin="donut"] .dial::before,
html[data-skin="topo"] .ring line, html[data-skin="matrix"] .ring line, html[data-skin="paper"] .ring line, html[data-skin="donut"] .ring line,
html[data-skin="topo"] .go .steps, html[data-skin="matrix"] .go .steps, html[data-skin="paper"] .go .steps, html[data-skin="donut"] .go .steps { display: none; }
html[data-skin="topo"] .go > svg, html[data-skin="matrix"] .go > svg, html[data-skin="paper"] .go > svg, html[data-skin="donut"] .go > svg { width: 46%; height: 46%; }
html[data-skin="topo"] .go::after, html[data-skin="matrix"] .go::after, html[data-skin="paper"] .go::after, html[data-skin="donut"] .go::after {
  background: radial-gradient(circle, rgba(255,255,255,.45) 0%, transparent 72%); }
.skinsvg .hit-anim { transform-box: fill-box; transform-origin: center; }

/* topo: contour map */
html[data-skin="topo"] { --tp: calc(var(--hue) + 38); --bg: hsl(var(--tp) 38% 13%); }
html[data-skin="topo"] body { background-color: var(--bg); background-image: none; }
html[data-skin="topo"] .go, html[data-skin="topo"] .go.down, html[data-skin="topo"] .go.live {
  inset: 35%; border: 0; background: hsl(var(--tp) 85% 72%); color: hsl(var(--tp) 45% 12%);
  box-shadow: 0 0 28px hsl(var(--tp) 85% 72% / .35); }
.tp-f, .tp-m, .tp-i { fill: none; stroke-linejoin: round; stroke: hsl(var(--tp, 76) 85% 72%); }
.tp-f { stroke-width: 1; stroke-opacity: .22; }
.tp-m { stroke-width: 1; stroke-opacity: .5; }
.tp-i { stroke-width: 2; stroke-opacity: .85; }
.tp-spin { animation: tpspin 240s linear infinite; }
.tp-spin.b { animation-duration: 160s; animation-direction: reverse; }
.tp-spin.c { animation-duration: 320s; }
@keyframes tpspin { to { transform: rotate(360deg); } }
.tp-step { fill: none; stroke-linecap: round; stroke: hsl(var(--tp, 76) 85% 72% / .35); stroke-width: 1.6; }
.tp-step.n { stroke: hsl(var(--tp, 76) 85% 72%); }
.tp-step.hit { animation: tphit .7s ease-out; }
@keyframes tphit { 0% { stroke: hsl(calc(var(--tp, 76) + 150) 100% 66%); stroke-width: 14; } 100% { stroke-width: 6; } }

/* matrix: dot wave */
html[data-skin="matrix"] { --mh: calc(var(--hue) - 23); --bg: #0B0B0C; }
html[data-skin="matrix"] body { background-color: var(--bg); background-image: none; }
html[data-skin="matrix"] .go, html[data-skin="matrix"] .go.down, html[data-skin="matrix"] .go.live {
  inset: 33.5%; border: 0; background: hsl(var(--mh) 25% 94%); color: #0B0B0C; }
.mx { fill: none; stroke-linecap: round; }
.mx0 { stroke: hsl(var(--mh, 15) 30% 14%); stroke-width: 3; }
.mx1 { stroke: hsl(var(--mh, 15) 60% 30%); stroke-width: 6; }
.mx2 { stroke: hsl(var(--mh, 15) 75% 44%); stroke-width: 10; }
.mx3 { stroke: hsl(var(--mh, 15) 100% 58%); stroke-width: 14; }
.mx4 { stroke: hsl(var(--mh, 15) 100% 68%); stroke-width: 18; }
.mx-clear { fill: #0B0B0C; }
.mx-dot { fill: hsl(var(--mh, 15) 15% 36%); transform-box: fill-box; transform-origin: center; }
.mx-dot.n { fill: hsl(var(--mh, 15) 30% 94%); }
.mx-dot.hit { animation: mxhit .6s cubic-bezier(.2, .9, .3, 1.3); }
@keyframes mxhit { 0% { fill: hsl(var(--mh, 15) 100% 58%); transform: scale(2.6); } 100% { transform: scale(1); } }

/* paper: stacked cut paper */
html[data-skin="paper"] { --ph: calc(var(--hue) - 34); --bg: hsl(var(--ph) 65% 89%); }
html[data-skin="paper"] body { background-color: var(--bg); background-image: none; }
html[data-skin="paper"] .go, html[data-skin="paper"] .go.down, html[data-skin="paper"] .go.live {
  inset: 31.5%; border: 0; background: hsl(var(--ph) 60% 96%); color: hsl(calc(var(--ph) + 170) 40% 40%);
  box-shadow: 0 7px 10px hsl(var(--ph) 50% 30% / .28); }
.pp1 { fill: hsl(var(--ph, 4) 70% 78%); }
.pp2 { fill: hsl(calc(var(--ph, 4) + 40) 85% 72%); }
.pp3, .pp-b { fill: hsl(calc(var(--ph, 4) - 15) 75% 66%); }
.pp4 { fill: hsl(calc(var(--ph, 4) + 170) 40% 40%); }
.pp-b { transform-box: fill-box; transform-origin: center; }
.pp-b.hit { animation: pphit .6s cubic-bezier(.2, .9, .3, 1.4); }
@keyframes pphit { 0% { fill: hsl(var(--ph, 4) 60% 96%); transform: scale(1.9); } 100% { transform: scale(1); } }

/* donut: glazed, crispy */
html[data-skin="donut"] { --dh: calc(var(--hue) + 302); --bg: hsl(var(--dh) 80% 91%); }
html[data-skin="donut"] body { background-color: var(--bg); background-image: none; }
html[data-skin="donut"] .go, html[data-skin="donut"] .go.down, html[data-skin="donut"] .go.live {
  inset: 32%; border: 3px solid rgba(42, 18, 8, .6); color: hsl(var(--dh) 100% 85%);
  background: radial-gradient(circle at 50% 40%, #7A3B1B, #3B1B0C); }
.dn-g0 { stop-color: hsl(var(--dh, 340) 100% 85%); }
.dn-g1 { stop-color: hsl(var(--dh, 340) 85% 66%); }
.dn-gloss { fill: none; stroke: hsl(var(--dh, 340) 100% 95% / .7); stroke-width: 5; stroke-linecap: round; }
.dn-crumb { fill: none; stroke: #F6D49A; stroke-width: 2.5; stroke-linecap: round; opacity: .7; }
.dn-sugar { fill: none; stroke: #fff; stroke-width: 2.4; stroke-linecap: round; animation: twinkle 2.4s ease-in-out infinite; }
@keyframes twinkle { 0%, 100% { opacity: .95; } 50% { opacity: .45; } }
.dn-s { fill: none; stroke-linecap: round; stroke-width: 9; transform-box: fill-box; transform-origin: center; }
.dn-s.s0 { stroke: #fff; }
.dn-s.s1 { stroke: hsl(calc(var(--dh, 340) + 150) 70% 58%); }
.dn-s.s2 { stroke: #FFD23F; }
.dn-s.s3 { stroke: #6C63FF; }
.dn-s.rest { stroke: #FFF0F6; stroke-width: 4; opacity: .7; }
.dn-s.hit { animation: dnhit .65s cubic-bezier(.2, .9, .3, 1.4); }
@keyframes dnhit { 0% { stroke: #fff; stroke-width: 22; transform: scale(1.6); } 100% { transform: scale(1); } }
/* swipe between skins: the scene follows the finger, flies out, the next one flies in from the other side; dots show where you are */
.stage, .skinsvg { transform: translateX(var(--sw, 0px)); opacity: var(--swo, 1); transition: transform .12s ease-out, opacity .12s; }
html.swap-out .stage, html.swap-out .skinsvg { animation: swapout .17s ease-in forwards; }
html.swap-in .stage, html.swap-in .skinsvg { animation: swapin .32s cubic-bezier(.2, .8, .2, 1); }
@keyframes swapout { to { opacity: 0; transform: translateX(calc(var(--dir, 1) * -90px)) scale(.94); } }
@keyframes swapin { from { opacity: 0; transform: translateX(calc(var(--dir, 1) * 120px)) scale(.94); } to { opacity: 1; transform: none; } }
.skindots { position: fixed; left: 50%; bottom: calc(env(safe-area-inset-bottom, 0px) + 28px); transform: translateX(-50%);
  display: flex; gap: 8px; z-index: 6; pointer-events: none; opacity: 0; transition: opacity .25s; }
.skindots.show { opacity: 1; }
.skindots i { display: block; width: 6px; height: 6px; border-radius: 3px; background: rgba(255,255,255,.3); transition: width .25s, background .25s; }
.skindots i.on { width: 22px; background: rgba(255,255,255,.95); }
@media (prefers-reduced-motion: reduce) {
  html.swap-out .stage, html.swap-out .skinsvg, html.swap-in .stage, html.swap-in .skinsvg { animation: none; }
  .tp-spin, .dn-sugar, .tp-step.hit, .mx-dot.hit, .pp-b.hit, .dn-s.hit { animation: none; }
}

/* mandala and ridges: dark skins with their own full-screen layer */
html[data-skin="mandala"] .skinsvg, html[data-skin="ridges"] .skinsvg { display: block; }
html[data-skin="mandala"] .bg, html[data-skin="ridges"] .bg,
html[data-skin="mandala"] .dial::before, html[data-skin="ridges"] .dial::before,
html[data-skin="mandala"] .ring line, html[data-skin="ridges"] .ring line,
html[data-skin="mandala"] .go .steps, html[data-skin="ridges"] .go .steps { display: none; }
html[data-skin="mandala"] .go > svg, html[data-skin="ridges"] .go > svg { width: 46%; height: 46%; }
html[data-skin="mandala"] .go::after, html[data-skin="ridges"] .go::after { background: radial-gradient(circle, hsl(var(--hue) 100% 75% / .5) 0%, transparent 72%); }
html[data-skin="mandala"], html[data-skin="ridges"] { --accent: hsl(var(--hue) 100% 70%); --bg: hsl(var(--hue) 28% 5%); }
html[data-skin="mandala"] body, html[data-skin="ridges"] body { background-color: var(--bg); background-image: none; }
html[data-skin="ridges"] body { transition: none; }

.fan-arc { position: absolute; left: 50%; bottom: 0; height: calc(100% / 6); aspect-ratio: 2 / 1; transform: translateX(-50%); }
.fan-svg { display: block; width: 100%; height: 100%; overflow: visible; }
.fan-sec { color: #f1ece4; }
.fan-sec .sec { fill: #17171d; stroke: rgba(255,255,255,.22); stroke-width: .7; transition: fill .08s; }
.fan-sec .ico * { fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.fan-sec.hot .sec { fill: hsl(var(--hue, 38) 55% 30%); }
.fan-sec.on { color: hsl(var(--hue, 38) 90% 78%); }
.fan-sec.on .sec { fill: hsl(var(--hue, 38) 40% 18%); }
.fan-sec.hot.on .sec { fill: hsl(var(--hue, 38) 55% 30%); }
.fan-sec.dis { opacity: .5; }
#fanLock .shut, #fanLock.on .open { display: none; }
#fanLock.on .shut { display: inline; }
#fanHold.on .ico .dot { fill: currentColor; }
@media (prefers-reduced-motion: reduce) { html.lock-shake .stage, html.lock-shake .skinsvg, #fan.open { animation: none; } }
</style>
</head>
<body>
<div class="bg" id="bg" aria-hidden="true"></div>
<div class="skindots" id="skindots" aria-hidden="true"></div>
<svg id="skin" class="skinsvg" viewBox="-195 -422 390 844" preserveAspectRatio="xMidYMid slice" aria-hidden="true"></svg>
<main class="app" role="application" aria-label="Subversum">

  <section class="stage">
    <div class="dial">
      <svg id="ring" class="ring" viewBox="0 0 200 200" aria-hidden="true"></svg>
      <button id="go" class="go" type="button" aria-label="Нажать: случайный арпеджиатор"><svg id="steps" class="steps" viewBox="-70 -70 140 140" aria-hidden="true"></svg><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2v10"/><path d="M18.4 6.6a9 9 0 1 1-12.77.04"/></svg></button>
    </div>
  </section>
</main>
<div id="lockframe" aria-hidden="true"></div>
<div id="handle" aria-hidden="true"></div>
<div id="sabprobe" aria-hidden="true"></div>
<div id="fan" aria-hidden="true">
  <div class="fan-top"><b id="fanBpm">—</b><i>BPM</i><span id="fanKey"></span></div>
  <div class="fan-arc"><svg class="fan-svg" viewBox="0 0 200 100" aria-hidden="true">
    <g class="fan-sec" id="fanHold" data-act="hold"><path class="sec" d="M100 100L0.00 100.00A100 100 0 0 1 50.00 13.40Z"/><g class="ico" transform="translate(34.3 57.0)"><circle cx="12" cy="12" r="10" stroke-dasharray="2 3.2"/><circle cx="12" cy="12" r="5.8"/><circle class="dot" cx="12" cy="12" r="2.2"/></g></g>
    <g class="fan-sec" id="fanLock" data-act="lock"><path class="sec" d="M100 100L50.00 13.40A100 100 0 0 1 150.00 13.40Z"/><g class="ico" transform="translate(88.0 26.0)"><rect x="5" y="11" width="14" height="10" rx="2"/><path class="shut" d="M8 11V8a4 4 0 0 1 8 0v3"/><path class="open" d="M8 11V8a4 4 0 0 1 7.6-1.7"/></g></g>
    <g class="fan-sec" id="fanShare" data-act="share"><path class="sec" d="M100 100L150.00 13.40A100 100 0 0 1 200.00 100.00Z"/><g class="ico" transform="translate(141.7 57.0)"><path d="M12 15V4"/><path d="M8 8l4-4 4 4"/><path d="M5 13v6h14v-6"/></g></g>
  </svg></div>
</div>

<script>
(() => {
  const $ = s => document.querySelector(s);
  const NOTES = ['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'];
  const WAVES = [['sine','SIN'],['triangle','TRI'],['sawtooth','SAW']];
  const SCALES = [
    { name: 'MAJOR',      iv: [0,2,4,5,7,9,11] },
    { name: 'MINOR',      iv: [0,2,3,5,7,8,10] },
    { name: 'DORIAN',     iv: [0,2,3,5,7,9,10] },
    { name: 'LYDIAN',     iv: [0,2,4,6,7,9,11] },
    { name: 'MIXOLYDIAN', iv: [0,2,4,5,7,9,10] },
    { name: 'MIN PENTA',  iv: [0,3,5,7,10] },
    { name: 'MAJ PENTA',  iv: [0,2,4,7,9] }
  ];
  const FM_RATIOS = [0.5, 1, 1.5, 2, 2.5, 3, 3.5, 4, 5, 7];
  const FM_MAX = 4.5;     // FM index ceiling (peak deviation / modulator frequency)
  const K = 5;            // number of fold lobes across the full input range
  const DEPTH_MAX = 0.8;  // pre-fold gain ceiling
  const SYM_MAX = 0.08;   // DC offset ceiling at the fold input
  const RES_MAX = 18;     // LPG resonance ceiling, dB (Web Audio lowpass Q is in dB)
  const MASTER = 0.85;
  const BPM_MIN = 110, BPM_MAX = 135;
  const STEPS = 16;
  const LOW = 24, HIGH = 47; // MIDI C1..B2, so every melody note stays in octave 1 or 2
  const LFO_RATE_MIN = 0.02; // Hz, one cycle in 50 s
  const LFO_RATE_MAX = 3;    // Hz, gentle movement only, nothing that turns into tremolo or FM noise
  const LFO_CHANCE = 0.5;    // share of patches that get any LFO at all
  const LFO_SHAPES = ['sine', 'sine', 'sine', 'triangle'];
  const LFO_TARGETS = ['pitch', 'ratio', 'index', 'fold', 'sym', 'cut', 'res'];

  const rnd = (a, b) => a + Math.random() * (b - a);
  const lrnd = (a, b) => Math.exp(rnd(Math.log(a), Math.log(b)));
  const pick = arr => arr[Math.floor(Math.random() * arr.length)];

  /* ---------- seed: one 32-bit number decides a press's patch, scale, key, tempo and 16-step pattern ---------- */
  const SEED_VERSION = 1;   // bump when any range or roll order changes: the same seed then means something else
  function mulberry32(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
  const MATH_RANDOM = Math.random;
  const newSeed = () => (MATH_RANDOM() * 4294967296) >>> 0;
  const seedToStr = n => (n >>> 0).toString(36);
  const strToSeed = t => { if (!/^[0-9a-z]{1,7}$/.test(t)) return null; const n = parseInt(t, 36); return n >= 0 && n < 4294967296 ? n : null; };
  // runs fn with Math.random replaced by the seeded generator, so every roll inside it is a pure function of the seed; real randomness comes back after
  function withSeed(seed, fn) { Math.random = mulberry32(seed); try { return fn(); } finally { Math.random = MATH_RANDOM; } }

  /* ---------- audio ---------- */
  let ctx = null, master = null, foldCurve = null, voice = null, pending = false, queued = [];

  function build() {
    try { if (navigator.audioSession) navigator.audioSession.type = 'playback'; } catch (e) {}
    const AC = window.AudioContext || window.webkitAudioContext;
    ctx = new AC({ latencyHint: 'interactive' });
    master = ctx.createGain();
    master.gain.value = MASTER;
    // transparent soft limiter: linear up to 0.8, then rounds off toward 0.95
    const lim = ctx.createWaveShaper();
    const lc = new Float32Array(2049);
    for (let i = 0; i < lc.length; i++) {
      const x = (i / (lc.length - 1)) * 2 - 1, ax = Math.abs(x);
      lc[i] = ax <= 0.8 ? x : Math.sign(x) * (0.8 + 0.2 * Math.tanh((ax - 0.8) / 0.2));
    }
    lim.curve = lc;
    master.connect(lim);
    lim.connect(ctx.destination);

    const n = 4097;
    foldCurve = new Float32Array(n);
    for (let i = 0; i < n; i++) {
      const x = (i / (n - 1)) * 2 - 1;
      foldCurve[i] = Math.sin(Math.PI * K * x);
    }
  }

  function roll() {
    const oct = Math.random() < 0.5 ? 1 : 2;           // the only fixed rule
    const semi = Math.floor(Math.random() * 12);
    const midi = 12 * (oct + 1) + semi;                 // C1 = 24, C2 = 36
    return {
      oct, semi,
      freq: 440 * Math.pow(2, (midi - 69) / 12),
      wave: pick(WAVES),
      fmRatio: pick(FM_RATIOS) * (Math.random() < 0.25 ? 1 + rnd(-0.02, 0.02) : 1),
      fmIdx: rnd(0, FM_MAX),
      fmSweep: rnd(0.05, 1),         // FM index at the end of the decay, relative to the start
      depth: rnd(0.06, DEPTH_MAX),
      sym: rnd(-1, 1) * SYM_MAX,
      sweep: rnd(0.2, 1),            // fold depth at the end of the decay, relative to the start
      decay: lrnd(0.12, 1.8),        // seconds until the gate is nearly closed
      attack: rnd(0.001, 0.014),
      cutoff: lrnd(900, 9000),
      res: rnd(0, RES_MAX),
      vel: 1,
      lfo: rollLfo(),
      vis: [{ shape: 'sine', rate: lrnd(0.03, 0.3), depth: 1, phase: rnd(0, Math.PI * 2) }], // silent twin that only drives the background when there is no audio LFO
      lfoNodes: null
    };
  }

  // 1 to 3 hidden LFOs, each with its own target, shape, rate, depth and starting phase
  function rollLfo() {
    if (Math.random() >= LFO_CHANCE) return [];
    const n = 1 + (Math.random() < 0.2 ? 1 : 0);
    const out = [];
    for (let i = 0; i < n; i++) {
      out.push({
        target: pick(LFO_TARGETS),
        shape: pick(LFO_SHAPES),
        rate: lrnd(LFO_RATE_MIN, LFO_RATE_MAX),
        depth: rnd(0.15, 0.6),
        phase: rnd(0, Math.PI * 2)
      });
    }
    return out;
  }

  let cur = null; // envelope info for the ring

  // LFO waveform as a band-limited periodic wave, rotated to the LFO's starting phase
  function lfoWave(shape, phase) {
    const H = 32, re = new Float32Array(H + 1), im = new Float32Array(H + 1);
    for (let k = 1; k <= H; k++) {
      let a = 0;
      if (shape === 'sine') a = k === 1 ? 1 : 0;
      else if (shape === 'triangle') a = k % 2 ? (((k - 1) / 2) % 2 ? -1 : 1) / (k * k) : 0;
      else if (shape === 'saw') a = (k % 2 ? 1 : -1) / k;
      else a = k % 2 ? 1 / k : 0; // square
      im[k] = a * Math.cos(k * phase);
      re[k] = a * Math.sin(k * phase);
    }
    return ctx.createPeriodicWave(re, im);
  }

  // The LFOs belong to a patch: every note of a held melody shares them, so slow ones really drift
  function ensureLfo(p) {
    if (p.lfoNodes) return p.lfoNodes;
    p.lfoT0 = ctx.currentTime;
    p.lfoNodes = p.lfo.map(def => {
      const o = ctx.createOscillator();
      o.setPeriodicWave(lfoWave(def.shape, def.phase));
      o.frequency.value = def.rate;
      o.start();
      return { osc: o, def };
    });
    return p.lfoNodes;
  }

  function retireLfo(p) {
    if (!p || !p.lfoNodes) return;
    const t = ctx.currentTime + 0.1;
    p.lfoNodes.forEach(l => { try { l.osc.stop(t); } catch (e) {} });
  }

  function atTime(when, fn) {
    const d = (when - ctx.currentTime) * 1000;
    if (d <= 4) fn(); else setTimeout(fn, d);
  }

  const XM = { cut: 1, fm: 1, fold: 1, dec: 1 };   // the finger on amber: brightness, FM index, fold depth, gate decay, as multipliers of the press patch
  let lastPlay = null;   // the last amber note, for the P tap
  let thrT = -9, thrTimer = 0;   // mandala: when the last P throw was struck
  const thrAmt = () => clamp(1 - (performance.now() - thrT) / 1300, 0, 1);
  // topo: the P tap swells the drone (a quick rise in about 0.25 s, then it settles over two seconds); the P pinch picks the interval of the second voice in steps
  let swT = -9, swTimer = 0;
  const swellAmt = () => { const t = (performance.now() - swT) / 1000; return t < 0 || t > 2.6 ? 0 : t < 0.25 ? t / 0.25 : Math.exp(-(t - 0.25) / 0.9); };
  const TOPO_IV = [[-0.6, 2, 0, 'OCTAVE'], [-0.2, 1.3348, 0.15, 'FOURTH'], [0.2, 1.4983, 0.25, 'FIFTH'], [0.45, 1.5874, 0.5, 'MIN 6TH'], [0.75, 1.4142, 0.8, 'TRITONE'], [9, 1.0595, 1, 'MIN 2ND']];
  const topoIv = () => { for (let i = 0; i < TOPO_IV.length; i++) if (PX.d <= TOPO_IV[i][0]) return TOPO_IV[i]; return TOPO_IV[5]; };
  function play(p, when) {
    const now = when === undefined ? ctx.currentTime : when;

    if (voice) {
      voice.kill.gain.setTargetAtTime(0, now, 0.005);
      try { voice.osc.stop(now + 0.05); } catch (e) {}
      try { voice.mod.stop(now + 0.05); } catch (e) {}
    }

    const t0 = now + 0.012;
    const tau = p.decay / 3 * XM.dec;
    const ta = t0 + p.attack;
    if (!p.stab) lastPlay = p;
    // P pinch: together snaps the modulator to a whole ratio (a clean tone), apart pushes it off one (an inharmonic bell)
    const fr = PX.d < 0 ? p.fmRatio + (Math.max(1, Math.round(p.fmRatio)) - p.fmRatio) * -PX.d : p.fmRatio * Math.pow(2, 0.55 * PX.d);

    const osc = ctx.createOscillator();
    osc.type = p.wave[0];
    osc.frequency.value = p.freq;

    // FM: a sine modulator drives the carrier frequency; its index sweeps down with the decay
    const mod = ctx.createOscillator();
    mod.type = 'sine';
    mod.frequency.value = p.freq * fr;
    const modG = ctx.createGain();
    const dev = Math.min(FM_MAX, p.fmIdx * XM.fm) * p.freq * fr;
    modG.gain.setValueAtTime(dev, t0);
    modG.gain.setTargetAtTime(dev * p.fmSweep, t0, tau * 0.7);
    mod.connect(modG);
    modG.connect(osc.frequency);

    const pre = ctx.createGain();
    const shaper = ctx.createWaveShaper();
    shaper.curve = foldCurve;
    shaper.oversample = '4x';
    const hp = ctx.createBiquadFilter();
    hp.type = 'highpass'; hp.frequency.value = 22; hp.Q.value = 0.7;
    const lpf = ctx.createBiquadFilter();
    lpf.type = 'lowpass'; lpf.Q.value = p.res;
    const vca = ctx.createGain();
    vca.gain.value = 0;
    const kill = ctx.createGain();

    osc.connect(pre);
    pre.connect(shaper);
    let off = null;
    if (ctx.createConstantSource) {
      off = ctx.createConstantSource();
      off.offset.value = p.sym;
      off.connect(shaper);
    }
    shaper.connect(hp);
    hp.connect(lpf);
    lpf.connect(vca);
    vca.connect(kill);
    kill.connect(master);

    // LFOs: each one feeds a gain that scales it into the units of its target parameter
    const taps = [];
    ensureLfo(p).forEach(l => {
      const d = l.def.depth;
      let params = null, amount = 0;
      switch (l.def.target) {
        case 'pitch': params = [osc.detune, mod.detune]; amount = 14 * d; break;            // cents, vibrato
        case 'ratio': params = [mod.detune]; amount = 120 * d; break;                       // cents, FM ratio drift
        case 'index': params = [modG.gain]; amount = 0.25 * FM_MAX * p.freq * fr * d; break; // Hz of deviation
        case 'fold':  params = [pre.gain]; amount = 0.18 * d; break;                        // fold depth
        case 'sym':   if (off) { params = [off.offset]; amount = 0.8 * SYM_MAX * d; } break; // fold symmetry
        case 'cut':   params = [lpf.detune]; amount = 1100 * d; break;                      // cents, up to 2 octaves
        case 'res':   params = [lpf.Q]; amount = 3 * d; break;                              // dB
      }
      if (!params) return;
      const tg = ctx.createGain();
      tg.gain.value = amount;
      l.osc.connect(tg);
      params.forEach(pm => tg.connect(pm));
      taps.push({ l, tg });
    });

    // fold depth sweeps down while the gate closes
    const dep = Math.min(DEPTH_MAX, p.depth * XM.fold);
    pre.gain.setValueAtTime(dep, t0);
    pre.gain.setTargetAtTime(dep * p.sweep, t0, tau * 0.9);

    // low pass gate: one envelope opens the level and the cutoff together; the cutoff closes faster
    const fMin = 70;
    vca.gain.setValueAtTime(0, t0);
    const peak = 0.9 * (1 - 0.45 * p.res / RES_MAX) * p.vel; // resonance adds level, so trim it
    vca.gain.linearRampToValueAtTime(peak, ta);
    vca.gain.setTargetAtTime(0, ta, tau);
    lpf.frequency.setValueAtTime(fMin, t0);
    lpf.frequency.exponentialRampToValueAtTime(Math.max(fMin * 1.2, Math.min(16000, p.cutoff * XM.cut)), ta);
    lpf.frequency.setTargetAtTime(fMin, ta, tau * 0.55);

    const end = ta + tau * 8;
    osc.start(t0); osc.stop(end);
    mod.start(t0); mod.stop(end);
    if (off) { off.start(t0); off.stop(end); }
    osc.onended = () => {
      [osc, mod, modG, pre, shaper, hp, lpf, vca, kill].forEach(n => { try { n.disconnect(); } catch (e) {} });
      if (off) { try { off.disconnect(); } catch (e) {} }
      taps.forEach(t => {
        try { t.l.osc.disconnect(t.tg); } catch (e) {}
        try { t.tg.disconnect(); } catch (e) {}
      });
      const qi = queued.indexOf(v);
      if (qi >= 0) queued.splice(qi, 1);
      if (voice && voice.osc === osc) voice = null;
    };
    const v = { osc, mod, kill, t0, cancelled: false };
    voice = v;
    queued.push(v);

    atTime(t0, () => {
      if (v.cancelled) return;
      cur = { t0, a: p.attack, tau };
      if (p.step !== undefined) flashStep(p.step, p.vel);
      pulse(p.vel);
      if (!raf) raf = requestAnimationFrame(loop);
    });
  }

  // P tap in topo: the drone swells
  function topoSwell() {
    if (!cont || !cont.swell) return;
    swT = performance.now(); cont.swell();
    clearInterval(swTimer);
    swTimer = setInterval(() => { applyMacros(); if (swellAmt() <= 0) clearInterval(swTimer); }, 50);
  }
  // P tap in mandala: the throw. The last chord is struck once more, the echo takes it in full and its feedback opens for about a second while the dry chord ducks
  function mandalaThrow() {
    if (!seq || !seq.dubChord || !seq.lastSt || !ctx) return;
    playDub(seq, Object.assign({}, seq.lastSt, { vel: 1 }), (seq.i + STEPS - 1) % STEPS, ctx.currentTime + 0.004);
    thrT = performance.now(); clearInterval(thrTimer);
    thrTimer = setInterval(() => { applyMacros(); if (thrAmt() <= 0) clearInterval(thrTimer); }, 50);
  }
  // P tap in amber: the last note again, struck harder, with the gate flung wide open and the FM pushed up; it takes the place of the note that rings now
  function amberStab() {
    if (!lastPlay || !ctx) return;
    play(Object.assign({}, lastPlay, { stab: true, vel: 1.2, attack: 0.002, cutoff: Math.min(16000, lastPlay.cutoff * 3), fmIdx: lastPlay.fmIdx * 1.4, decay: lastPlay.decay * 1.3, step: undefined }), ctx.currentTime + 0.004);
  }

  /* ---------- dub techno chords (mandala skin only) ---------- */
  // Each press rolls a chord bus: filter, resonance, delay time/feedback/amount and reverb length/amount are all random.
  const isDub = () => document.documentElement.dataset.skin === 'mandala';
  let lastBus = null;

  function makeIR(sec) {
    const n = Math.floor(ctx.sampleRate * sec), b = ctx.createBuffer(2, n, ctx.sampleRate);
    for (let c = 0; c < 2; c++) {
      const d = b.getChannelData(c);
      let lp = 0;
      for (let i = 0; i < n; i++) {
        const t = i / n;
        lp += ((Math.random() * 2 - 1) - lp) * (0.06 + 0.8 * Math.exp(-4 * t)); // darker as it decays
        d[i] = lp * Math.exp(-6.9 * t);
      }
    }
    return b;
  }

  function disposeBus(b) {
    if (!b) return;
    try { b.out.gain.setTargetAtTime(0, ctx.currentTime, 0.4); } catch (e) {}
    setTimeout(() => {
      try { b.lfo.stop(); } catch (e) {}
      b.mods.forEach(n => { try { if (n.stop) n.stop(); n.disconnect(); } catch (e) {} });
      if (b.sh) b.sh.nodes.forEach(n => { try { if (n.stop) n.stop(); n.disconnect(); } catch (e) {} });
      [b.sat, b.inp, b.out, b.dl, b.dr, b.fb, b.dlp, b.dhp, b.dsend, b.rsend, b.conv, b.lfo, b.lfoG, b.pl, b.pr].forEach(n => { try { n.disconnect(); } catch (e) {} });
    }, 3000);
  }

  // chord voicings in semitones above the root, the Basic Channel way (as in the Portus world of touch2decay)
  const DUB_CHORDS = [
    { name: 'm7',  iv: [0, 7, 10, 15] },
    { name: 'm7',  iv: [0, 7, 10, 15] },
    { name: 'm9',  iv: [0, 7, 10, 14, 15] },
    { name: 'm9',  iv: [0, 7, 10, 14, 15] },
    { name: 'm11', iv: [0, 7, 10, 14, 15, 17] },
    { name: 'sus', iv: [0, 5, 10, 14] }
  ];
  const DUB_SCALES = ['MINOR', 'DORIAN', 'MIN PENTA'];
  const DUB_DT = [2, 3, 4, 6, 8]; // delay time in sixteenths

  // per-skin ranges for the shared effects bus: [min, max]
  const TW = {
    riso:     { cut: [1800, 9000], len: [0.05, 0.5],  fb: [0.2, 0.6],  dela: [0.1, 0.6],  revSec: [0.6, 1.6], reva: [0.05, 0.35] },
    scope:    { cut: [1500, 7000], len: [0.03, 0.35], fb: [0.3, 0.75], dela: [0.2, 0.8],  revSec: [1, 2.5],   reva: [0.05, 0.4],  res: [0, 10] },
    topo:     { cut: [300, 2200],  len: [0.3, 0.9],   fb: [0.2, 0.6],  dela: [0, 0.35],   revSec: [2.5, 5],   reva: [0.4, 0.9],  res: [3, 14] },
    matrix:   { cut: [400, 6000],  len: [0.02, 0.3],  fb: [0.3, 0.75], dela: [0.15, 0.7], revSec: [0.5, 1.5], reva: [0, 0.3] },
    vector:   { cut: [2500, 9000], len: [0.2, 0.6], fb: [0.2, 0.5], dela: [0.1, 0.4], revSec: [1.2, 2.8], reva: [0.15, 0.45], res: [0, 4] },
    clouds:   { shimmer: true, cut: [2500, 7000], len: [0.25, 0.8],  fb: [0.2, 0.55], dela: [0.1, 0.5],  revSec: [1.8, 3.5], reva: [0.35, 0.8], res: [0, 6] },
    shepard:  { cut: [1200, 5000], len: [0.3, 0.8], fb: [0.35, 0.65], dela: [0.25, 0.6], revSec: [2, 4], reva: [0.25, 0.55], res: [0, 3] },

  function buildScope() {
    // Conway's Game of Life on a torus. Every note fires a glider (loud) or a blinker (soft) at the finger and advances the field one generation; when nothing plays it drifts slowly

  function buildMatrix() {

  const SKINS = ['amber', 'riso', 'scope', 'topo', 'matrix', 'mandala', 'ridges', 'clouds', 'vector', 'shepard', 'overtones'];   // paper and donut are light: kept in the code, out of the rotation

    let order = KEYS.slice();   // newest first; a line moves to the front only when it wakes up after a pause, so two axes moving together do not swap places
    const act = (k, now, front) => { const r = E[k]; if (front && now - r.t > 400) { order.splice(order.indexOf(k), 1); order.unshift(k); } r.t = now; };
    const txt = (r, key, v) => { if (r[key] !== v) { r[key] = v; (key === 'tb' ? r.b : r.em).textContent = v; } };   // the DOM is touched only when the text changes
    const bar = (r, v) => { r.s.style.left = (v >= 0 ? 50 : 50 + v * 50) + '%'; r.s.style.width = Math.abs(v) * 50 + '%'; r.u.style.left = (50 + v * 50) + '%'; };
    const AR = { x: ['◂', '▸'], y: ['▾', '▴'], p: ['›‹', '‹›'] };   // finger left / right, down / up, together / apart
    const dir = (k, v, lo, hi) => Math.abs(v) < 0.1 ? '·' : v < 0 ? AR[k][0] + ' ' + lo : hi + ' ' + AR[k][1];
    let pSkin = null, pHold = false, pLock = false, pHolding = false, pOn = false, tapUntil = 0, pZT0 = -1, zStep = -1, last = performance.now();
    function frame(now) {
      modRaf = requestAnimationFrame(frame);
      const dt = Math.min(0.1, (now - last) / 1000), kk = 1 - Math.exp(-dt * 14); last = now;
      const M = MOD[skin] || MOD.amber, tgt = { x: clamp(XY.nx, -1, 1), y: clamp(XY.ny, -1, 1), p: clamp(PX.d, -1, 1) };
      // X, Y follow the finger and P the pinch. Nothing counts as a change until the finger really moves: a new press snaps to its position quietly
      ['x', 'y', 'p'].forEach(a => {
        const r = E[a], live = a === 'p' ? PX.on : holding;
        if (!live || (a !== 'p' && !pHolding) || (a === 'p' && !pOn)) { r.v = r.ref = tgt[a]; return; }
        r.v += (tgt[a] - r.v) * kk;
        if (Math.abs(tgt[a] - r.ref) > 0.03) { r.ref = tgt[a]; act(a, now, true); }
      });
      if (PX.on && !pOn) { tapUntil = now + 900; act('p', now, true); }   // the second finger lands: show what its tap does
      pHolding = holding; pOn = PX.on;
      // events
      if (skin !== pSkin) { if (pSkin !== null) { txt(E.world, 'tb', 'world'); txt(E.world, 'te', skin); act('world', now, true); } pSkin = skin; }
      if (holdOn !== pHold) { pHold = holdOn; txt(E.hold, 'tb', 'hold'); txt(E.hold, 'te', holdOn ? 'on' : 'off'); act('hold', now, true); }
      if (locked !== pLock) { pLock = locked; txt(E.lock, 'tb', 'lock'); txt(E.lock, 'te', locked ? 'on' : 'off'); act('lock', now, true); }
      // Z: a new press starts the countdown (one second of nothing), then it opens; it wakes its line at the start, at the opening and at full, and keeps it alive in between
      const ze = holding && ctx && seq ? ctx.currentTime - zT0 : -1;
      if (M.z && ze >= 0) {
        if (zT0 !== pZT0) { pZT0 = zT0; zStep = -1; act('z', now, true); }
        if (ze < 1) act('z', now, false);
        else { const st = Math.floor(ZH * 10); if (st !== zStep) { zStep = st; act('z', now, st === 0 || st >= 10); } }
      }
      // fade and rank
      const vis = [];
      order.forEach(k => { const r = E[k], age = now - r.t; r.base = age < MOD_HOLD ? 1 : Math.max(0, 1 - (age - MOD_HOLD) / MOD_FADE); if (r.base > 0.01) vis.push(k); });
      KEYS.forEach(k => { const r = E[k], i = vis.indexOf(k), op = i < 0 || i >= MOD_RANK.length ? 0 : Math.round(r.base * MOD_RANK[i] * 100) / 100;
        if (op !== r.op) { r.op = op; r.e.style.opacity = op; }
        if (i >= 0 && i < MOD_RANK.length && i !== r.rk) { r.rk = i; r.e.style.transform = 'translateY(' + i * MOD_SLOT + 'px)'; }
        if (op === 0) return;
        // what the visible line says
        if (k === 'x' || k === 'y') { const m = M[k]; txt(r, 'tb', m[0]); txt(r, 'te', dir(k, r.v, m[1], m[2])); bar(r, r.v); }
        else if (k === 'p') { const m = M.p; txt(r, 'tb', m[0]); txt(r, 'te', now < tapUntil ? 'tap · ' + M.pt : M.pLive ? topoIv()[3].toLowerCase() : dir('p', r.v, m[1], m[2])); bar(r, r.v); }
        else if (k === 'z' && M.z) {
          const wait = ze >= 0 && ze < 1, w = clamp(wait ? 1 - ze : ze < 0 ? 0 : ZH, 0, 1);
          if (wait !== r.cd) { r.cd = wait; r.s.classList.toggle('cd', wait); }
          txt(r, 'tb', M.z[0]); r.s.style.left = '0'; r.s.style.width = w * 100 + '%'; r.u.style.left = w * 100 + '%';
          if (ze >= 0) txt(r, 'te', wait ? 'in ' + (1 - ze).toFixed(1) + 's' : ZH > 0.995 ? 'full' : M.z[1] + ' ' + Math.round(ZH * 100) + '%');
        }
      });
    }
    modRaf = requestAnimationFrame(frame);
  }
  function modStop() { if (!modEl) return; cancelAnimationFrame(modRaf); modEl.remove(); modEl = null; }
  Object.assign(window.subversum, { mod: v => { if (v) modStart(); else modStop(); try { localStorage.setItem('subversum.mod', v ? '1' : '0'); } catch (e) {} } });
  { let want = !/[?&]mod=0/.test(location.search); try { const ls = localStorage.getItem('subversum.mod'); if (ls === '0' && !/[?&]mod=1/.test(location.search)) want = false; } catch (e) {} if (want) modStart(); }
  /* ---------- HUD (debug): ?hud=1 shows what the fingers do, in the style of a game readout. Off by default, window.subversum.hud(true/false) switches it ---------- */
  const HUD_LABELS = {   // x, y, P pinch, P tap, per world (what the finger moves there)
    amber: ['GATE', 'TIMBRE', 'FM RATIO', 'ACCENT'], clouds: ['DENSITY', 'SPACE', 'PITCH SPREAD', 'FREEZE'], ridges: ['CUTOFF', 'RESONANCE', 'ENV DEPTH', 'STAB'],
    riso: ['STRIKE', 'DAMPING', 'ENVELOPE', 'HIT'], scope: ['PITCH', 'ECHO', 'HIT TYPE', 'SHOT'], topo: ['FILTER', 'PWM', 'INTERVAL', 'SWELL'], matrix: ['CRUSH', 'ARP RANGE', 'ARP RATE', 'RATCHET'], mandala: ['THROW', 'FILTER', 'ECHO TIME', 'THROW'], vector: ['TIMBRE', 'BODY', 'BORDER', 'SNAP'], shepard: ['WAVE', 'CUTOFF', 'ENV + RESO', 'HIT'], overtones: ['DRONE', 'REGISTER', 'HARMONICS', 'JUMP']
  };
  let hudEl = null, hudRaf = 0;
  function hudStart() {
    if (hudEl) return;
    hudEl = document.createElement('div'); hudEl.id = 'hud'; hudEl.setAttribute('aria-hidden', 'true');
    hudEl.innerHTML = '<div class="hd-top"><b></b><span></span></div>' + ['x', 'y', 'p'].map(k => '<div class="hd-row" data-k="' + k + '"><i>' + k.toUpperCase() + '</i><u></u><em>0.00</em><span class="hd-bar"><s></s></span></div>').join('') + '<div class="hd-raw"></div>';
    document.body.appendChild(hudEl);
    const q = sel => hudEl.querySelector(sel), rows = {};
    ['x', 'y', 'p'].forEach(k => { const r = q('.hd-row[data-k=' + k + ']'); rows[k] = { r, u: r.querySelector('u'), em: r.querySelector('em'), s: r.querySelector('s'), shown: 0 }; });
    const worldEl = q('.hd-top b'), chipEl = q('.hd-top span'), rawEl = q('.hd-raw');
    let pSkin = null, pHold = false, pLock = false, pOn = false, pops = 0;
    const pop = (host, text, ev) => {
      if (pops > 8) return;
      pops++;
      const e = document.createElement('div'); e.className = 'hd-pop' + (ev ? ' ev' : ''); e.textContent = text;
      e.addEventListener('animationend', () => { e.remove(); pops--; });
      host.appendChild(e);
    };
    const f2 = v => (v >= 0 ? '+' : '') + v.toFixed(2);
    function frame() {
      hudRaf = requestAnimationFrame(frame);
      const lab = HUD_LABELS[skin] || ['X', 'Y'], vals = { x: XY.nx, y: XY.ny, p: PX.d }, names = { x: lab[0], y: lab[1], p: lab[2] };
      if (skin !== pSkin) { pSkin = skin; worldEl.textContent = skin; pop(rows.x.r, 'WORLD ' + skin, true); ['x', 'y', 'p'].forEach(k => { rows[k].shown = vals[k]; }); }
      if (holdOn !== pHold) { pHold = holdOn; pop(rows.y.r, 'HOLD ' + (holdOn ? 'ON' : 'OFF'), true); }
      if (locked !== pLock) { pLock = locked; pop(rows.y.r, 'LOCK ' + (locked ? 'ON' : 'OFF'), true); }
      if (PX.on !== pOn) { pOn = PX.on; if (PX.on && lab[3]) pop(rows.p.r, 'TAP ' + lab[3], true); }
      ['x', 'y', 'p'].forEach(k => {
        const R = rows[k], v = vals[k], nm = names[k];
        R.r.classList.toggle('off', k === 'p' ? !nm : !holding);
        R.u.textContent = nm || '-';
        R.em.textContent = nm || k !== 'p' ? f2(v) : '--';
        R.s.style.left = (v >= 0 ? 50 : 50 + v * 50) + '%'; R.s.style.width = Math.abs(v) * 50 + '%';
        if (nm && Math.abs(v - R.shown) >= 0.25 && (k !== 'p' || PX.on || true)) { pop(R.r, f2(v - R.shown) + ' ' + nm, false); R.shown = v; }
      });
      chipEl.innerHTML = (holdOn ? '<b>HOLD</b>' : '') + (locked ? '<b>LOCK</b>' : '') + (PX.on ? '<b>P</b>' : '') + (seq ? '<i style="font-style:normal">' + seq.bpm + '</i>' : '');
      const b = lastBus;
      rawEl.textContent = skin === 'amber'
        ? 'DEC x' + XM.dec.toFixed(2) + '  CUT x' + XM.cut.toFixed(2) + '\nFM  x' + XM.fm.toFixed(2) + '  FOLD x' + XM.fold.toFixed(2)
        : b ? 'CUT ' + Math.round(b.cut || 0) + '  RES ' + (b.res || 0).toFixed(1) + '\nECHO ' + (b.delAmt || 0).toFixed(2) + '  REV ' + (b.revAmt || 0).toFixed(2) : '';
    }

  }
  function hudStop() { if (!hudEl) return; cancelAnimationFrame(hudRaf); hudEl.remove(); hudEl = null; }

  const HUD_DEFAULT = false;   // the permanent modulation HUD (#mod) replaces it; this one is for debugging only (?hud=1)
  let hudWanted = HUD_DEFAULT || /[?&]hud=1/.test(location.search);
  try { const ls = localStorage.getItem('subversum.hud'); if (/[?&]hud=0/.test(location.search) || ls === '0') hudWanted = false; else if (ls === '1') hudWanted = true; } catch (e) { if (/[?&]hud=0/.test(location.search)) hudWanted = false; }
  if (hudWanted) hudStart();
})();
