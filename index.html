<!doctype html>

<meta name="apple-mobile-web-app-capable" content="yes">

<title>Складка</title>
<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
/* Layout: one-screen instrument. Scope strip on top, tick-ring dial with a single button in the middle, signal-chain readout (VCO > FOLD > LPG) below. Black ground and one amber accent, same family as the watch-style worlds in the project. */
:root {
  --bg: #000000;
  --ink: #f1ece4;
  --dim: #8a847a;
  --tick: #2a2621;
  --tick-hi: #5d574d;
  --accent: #ffab40;
  --display: 'Oswald', 'Arial Narrow', sans-serif;
  --body: 'IBM Plex Sans Condensed', 'Arial Narrow', sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--body);
  padding-block: 12px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  -webkit-user-select: none;
  user-select: none;
  -webkit-tap-highlight-color: transparent;
  overscroll-behavior: none;
}
.app {
  height: 100%;
  max-width: 440px;
  margin: 0 auto;
  display: grid;
  grid-template-rows: auto auto minmax(0, 1fr) auto;
  gap: 14px;
}

.top { display: flex; justify-content: space-between; align-items: baseline; min-height: 24px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; margin: 0; }
.info {
  font: 500 13px/1.35 var(--body);
  letter-spacing: .14em;
  color: var(--accent);
  font-variant-numeric: tabular-nums;
}
.oct { display: flex; align-items: baseline; gap: 12px; }
.oct b { font: 400 20px var(--display); color: var(--tick-hi); transition: color .12s; }
.oct b[data-on] { color: var(--accent); }

#scope { display: block; width: 100%; height: clamp(72px, 13vh, 120px); }

.stage { container-type: size; display: grid; place-items: center; min-height: 0; }
.dial {
  position: relative;
  width: min(78vw, 300px);
  aspect-ratio: 1;
  width: min(100cqw, 100cqh, 340px);
}
.ring { position: absolute; inset: 0; width: 100%; height: 100%; }
.ring line { stroke-linecap: round; transition: stroke .05s; }
.ring .off { stroke: var(--tick); }
.ring .hi { stroke: var(--tick-hi); }
.ring .on { stroke: var(--accent); }

.go {
  position: absolute; inset: 17%;
  border-radius: 50%;
  border: 1px solid var(--tick-hi);
  background: radial-gradient(circle at 50% 35%, #1a1612, #060504 72%);
  color: var(--ink);
  display: grid; place-items: center;
  padding: 0;
  cursor: pointer;
  touch-action: manipulation;
  -webkit-touch-callout: none;
  transition: transform .06s, border-color .1s, color .1s;
}
.go svg {
  width: 34%; height: 34%;
  fill: none; stroke: currentColor; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round;
}
.go:active, .go.down, .go.live { transform: scale(.97); border-color: var(--accent); color: var(--accent); }
.go:focus-visible { outline: 2px solid var(--accent); outline-offset: 4px; }
.go.hit { animation: hit .55s ease-out; }
@keyframes hit {
  0% { box-shadow: 0 0 0 0 color-mix(in srgb, var(--accent) 55%, transparent), inset 0 0 40px color-mix(in srgb, var(--accent) 35%, transparent); }
  100% { box-shadow: 0 0 0 18px transparent, inset 0 0 0 transparent; }
}
@media (prefers-reduced-motion: reduce) { .go.hit { animation: none; } }

.chain { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; }
.blk { min-width: 0; display: grid; gap: 3px; align-content: start; }
.name { display: flex; align-items: center; height: 8px; }
.wire { flex: 1; height: 8px; position: relative; }
.wire::before { content: ""; position: absolute; left: 0; right: 2px; top: 50%; height: 1px; background: var(--tick-hi); }
.wire::after {
  content: ""; position: absolute; right: 1px; top: 50%;
  width: 5px; height: 5px;
  border-top: 1px solid var(--tick-hi); border-right: 1px solid var(--tick-hi);
  transform: translateY(-50%) rotate(45deg);
}
.big {
  margin-top: 4px;
  font: 300 clamp(28px, 9vw, 38px)/1 var(--display);
  font-variant-numeric: tabular-nums;
  white-space: nowrap;
}
.big small { font: 500 10px var(--body); letter-spacing: .14em; color: var(--dim); margin-left: 3px; }
.sub {
  font: 400 13px var(--body);
  color: var(--ink);
  font-variant-numeric: tabular-nums;
  white-space: nowrap;
}
.chain.idle .big, .chain.idle .sub { color: var(--tick-hi); }
.chain.idle small { visibility: hidden; }
</style>

<script>

</script>

<body>
<main class="app">
  <header class="top">
    <h1 class="sr">Складка</h1>
    <div class="info" id="info"></div>
    <div class="oct" aria-label="Октава, 1 или 2"><b id="o1">1</b><b id="o2">2</b></div>
  </header>

  <canvas id="scope" aria-hidden="true"></canvas>

  <section class="stage">
    <div class="dial">
      <svg id="ring" class="ring" viewBox="0 0 200 200" aria-hidden="true"></svg>
      <button id="go" class="go" type="button" aria-label="Тап: случайный звук. Зажать: случайная мелодия"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2v10"/><path d="M18.4 6.6a9 9 0 1 1-12.77.04"/></svg></button>
    </div>
  </section>

  <section class="chain idle" id="chain">
    <div class="blk">
      <div class="name"><span class="wire"></span></div>
      <div class="big" id="v-note">—</div>
      <div class="sub" id="v-hz">—</div>
      <div class="sub" id="v-wave">—</div>
      <div class="sub" id="v-fm">—</div>
    </div>
    <div class="blk">
      <div class="name"><span class="wire"></span></div>
      <div class="big"><span id="f-depth">—</span><small>%</small></div>
      <div class="sub" id="f-sym">—</div>
      <div class="sub" id="f-sweep">—</div>
    </div>
    <div class="blk">
      <div class="name"></div>
      <div class="big"><span id="l-cut">—</span><small>kHz</small></div>
      <div class="sub" id="l-dec">—</div>
      <div class="sub" id="l-res">—</div>
    </div>
  </section>
</main>

<script>
(() => {
  const $ = s => document.querySelector(s);
  const NOTES = ['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'];
  const WAVES = [['sine','SIN'],['triangle','TRI'],['sawtooth','SAW']];
  const SCALES = [
    { name: 'MAJOR',      iv: [0,2,4,5,7,9,11] },
    { name: 'MINOR',      iv: [0,2,3,5,7,8,10] },
    { name: 'DORIAN',     iv: [0,2,3,5,7,9,10] },
    { name: 'PHRYGIAN',   iv: [0,1,3,5,7,8,10] },
    { name: 'LYDIAN',     iv: [0,2,4,6,7,9,11] },
    { name: 'MIXOLYDIAN', iv: [0,2,4,5,7,9,10] },
    { name: 'HARM MINOR', iv: [0,2,3,5,7,8,11] },
    { name: 'MIN PENTA',  iv: [0,3,5,7,10] },
    { name: 'MAJ PENTA',  iv: [0,2,4,7,9] },
    { name: 'HIRAJOSHI',  iv: [0,2,3,7,8] },
    { name: 'WHOLE TONE', iv: [0,2,4,6,8,10] },
    { name: 'BLUES',      iv: [0,3,5,6,7,10] }
  ];
  const FM_RATIOS = [0.5, 1, 1.5, 2, 2.5, 3, 3.5, 4, 5, 7];
  const FM_MAX = 4.5;     // FM index ceiling (peak deviation / modulator frequency)
  const K = 5;            // number of fold lobes across the full input range
  const DEPTH_MAX = 0.8;  // pre-fold gain ceiling
  const SYM_MAX = 0.08;   // DC offset ceiling at the fold input
  const RES_MAX = 18;     // LPG resonance ceiling, dB (Web Audio lowpass Q is in dB)
  const MASTER = 0.85;
  const BPM_MIN = 110, BPM_MAX = 135;
  const HOLD_MS = 380;    // how long TRIG is held before the melody starts
  const STEPS = 16;
  const LOW = 24, HIGH = 47; // MIDI C1..B2, so every melody note stays in octave 1 or 2

  const rnd = (a, b) => a + Math.random() * (b - a);
  const lrnd = (a, b) => Math.exp(rnd(Math.log(a), Math.log(b)));
  const pick = arr => arr[Math.floor(Math.random() * arr.length)];
  const sgn = n => (n < 0 ? '−' : n > 0 ? '+' : '') + Math.abs(n);

  /* ---------- audio ---------- */
  let ctx = null, master = null, analyser = null, foldCurve = null, voice = null, pending = false;

  function build() {
    try { if (navigator.audioSession) navigator.audioSession.type = 'playback'; } catch (e) {}
    const AC = window.AudioContext || window.webkitAudioContext;
    ctx = new AC({ latencyHint: 'interactive' });
    master = ctx.createGain();
    master.gain.value = MASTER;
    analyser = ctx.createAnalyser();
    analyser.fftSize = 4096;
    analyser.smoothingTimeConstant = 0;
    // transparent soft limiter: linear up to 0.8, then rounds off toward 0.95
    const lim = ctx.createWaveShaper();
    const lc = new Float32Array(2049);
    for (let i = 0; i < lc.length; i++) {
      const x = (i / (lc.length - 1)) * 2 - 1, ax = Math.abs(x);
      lc[i] = ax <= 0.8 ? x : Math.sign(x) * (0.8 + 0.2 * Math.tanh((ax - 0.8) / 0.2));
    }
    lim.curve = lc;
    master.connect(lim);
    lim.connect(analyser);
    lim.connect(ctx.destination);

    const n = 4097;
    foldCurve = new Float32Array(n);
    for (let i = 0; i < n; i++) {
      const x = (i / (n - 1)) * 2 - 1;
      foldCurve[i] = Math.sin(Math.PI * K * x);
    }
  }

  function roll() {
    const oct = Math.random() < 0.5 ? 1 : 2;           // the only fixed rule
    const semi = Math.floor(Math.random() * 12);
    const midi = 12 * (oct + 1) + semi;                 // C1 = 24, C2 = 36
    return {
      oct, semi,
      freq: 440 * Math.pow(2, (midi - 69) / 12),
      wave: pick(WAVES),
      fmRatio: pick(FM_RATIOS) * (Math.random() < 0.25 ? 1 + rnd(-0.02, 0.02) : 1),
      fmIdx: rnd(0, FM_MAX),
      fmSweep: rnd(0.05, 1),         // FM index at the end of the decay, relative to the start
      depth: rnd(0.06, DEPTH_MAX),
      sym: rnd(-1, 1) * SYM_MAX,
      sweep: rnd(0.2, 1),            // fold depth at the end of the decay, relative to the start
      decay: lrnd(0.12, 1.8),        // seconds until the gate is nearly closed
      attack: rnd(0.001, 0.014),
      cutoff: lrnd(900, 9000),
      res: rnd(0, RES_MAX),
      vel: 1
    };
  }

  let cur = null; // envelope info for the ring

  function atTime(when, fn) {
    const d = (when - ctx.currentTime) * 1000;
    if (d <= 4) fn(); else setTimeout(fn, d);
  }

  function play(p, when) {
    const now = when === undefined ? ctx.currentTime : when;

    if (voice) {
      voice.kill.gain.setTargetAtTime(0, now, 0.005);
      try { voice.osc.stop(now + 0.05); } catch (e) {}
      try { voice.mod.stop(now + 0.05); } catch (e) {}
    }

    const t0 = now + 0.012;
    const tau = p.decay / 3;
    const ta = t0 + p.attack;

    const osc = ctx.createOscillator();
    osc.type = p.wave[0];
    osc.frequency.value = p.freq;

    // FM: a sine modulator drives the carrier frequency; its index sweeps down with the decay
    const mod = ctx.createOscillator();
    mod.type = 'sine';
    mod.frequency.value = p.freq * p.fmRatio;
    const modG = ctx.createGain();
    const dev = p.fmIdx * p.freq * p.fmRatio;
    modG.gain.setValueAtTime(dev, t0);
    modG.gain.setTargetAtTime(dev * p.fmSweep, t0, tau * 0.7);
    mod.connect(modG);
    modG.connect(osc.frequency);

    const pre = ctx.createGain();
    const shaper = ctx.createWaveShaper();
    shaper.curve = foldCurve;
    shaper.oversample = '4x';
    const hp = ctx.createBiquadFilter();
    hp.type = 'highpass'; hp.frequency.value = 22; hp.Q.value = 0.7;
    const lpf = ctx.createBiquadFilter();
    lpf.type = 'lowpass'; lpf.Q.value = p.res;
    const vca = ctx.createGain();
    vca.gain.value = 0;
    const kill = ctx.createGain();

    osc.connect(pre);
    pre.connect(shaper);
    let off = null;
    if (ctx.createConstantSource) {
      off = ctx.createConstantSource();
      off.offset.value = p.sym;
      off.connect(shaper);
    }
    shaper.connect(hp);
    hp.connect(lpf);
    lpf.connect(vca);
    vca.connect(kill);
    kill.connect(master);

    // fold depth sweeps down while the gate closes
    pre.gain.setValueAtTime(p.depth, t0);
    pre.gain.setTargetAtTime(p.depth * p.sweep, t0, tau * 0.9);

    // low pass gate: one envelope opens the level and the cutoff together; the cutoff closes faster
    const fMin = 70;
    vca.gain.setValueAtTime(0, t0);
    const peak = 0.9 * (1 - 0.45 * p.res / RES_MAX) * p.vel; // resonance adds level, so trim it
    vca.gain.linearRampToValueAtTime(peak, ta);
    vca.gain.setTargetAtTime(0, ta, tau);
    lpf.frequency.setValueAtTime(fMin, t0);
    lpf.frequency.exponentialRampToValueAtTime(p.cutoff, ta);
    lpf.frequency.setTargetAtTime(fMin, ta, tau * 0.55);

    const end = ta + tau * 8;
    osc.start(t0); osc.stop(end);
    mod.start(t0); mod.stop(end);
    if (off) { off.start(t0); off.stop(end); }
    osc.onended = () => {
      [osc, mod, modG, pre, shaper, hp, lpf, vca, kill].forEach(n => { try { n.disconnect(); } catch (e) {} });
      if (off) { try { off.disconnect(); } catch (e) {} }
      if (voice && voice.osc === osc) voice = null;
    };
    voice = { osc, mod, kill };

    atTime(t0, () => {
      cur = { t0, a: p.attack, tau };
      show(p);
      if (!raf) raf = requestAnimationFrame(loop);
    });
  }

  let tapPatch = null; // the patch of the last tap; a held melody keeps playing it
  function fire() {
    tapPatch = roll();
    play(tapPatch);
  }

  function press() {
    go.classList.remove('hit');
    void go.offsetWidth;
    go.classList.add('hit');
    if (!ctx) build();
    if (ctx.state === 'running') { fire(); return; }
    pending = true;
    ctx.resume().then(() => { if (pending) { pending = false; fire(); } }).catch(() => {});
  }

  /* ---------- melody generator ---------- */
  let seq = null;

  function makeStep(s) {
    if (Math.random() < 0.22) return null; // rest
    if (Math.random() < 0.15) s.idx = Math.floor(Math.random() * s.pool.length);
    else s.idx = Math.max(0, Math.min(s.pool.length - 1, s.idx + pick([-3, -2, -1, -1, 0, 1, 1, 2, 3])));
    return { midi: s.pool[s.idx], vel: Math.random() < 0.25 ? 1 : rnd(0.62, 0.85) };
  }

  function makeSeq() {
    const bpm = Math.round(rnd(BPM_MIN, BPM_MAX));
    const root = Math.floor(Math.random() * 12);
    const sc = pick(SCALES);
    const pool = [];
    for (let m = LOW; m <= HIGH; m++) {
      if (sc.iv.indexOf(((m - root) % 12 + 12) % 12) !== -1) pool.push(m);
    }
    const s = { bpm, root, sc, pool, dur: 60 / bpm / 4, steps: [], i: 0, bar: 0, idx: Math.floor(Math.random() * pool.length), timbre: tapPatch || roll(), next: 0, timer: 0 };
    for (let k = 0; k < STEPS; k++) s.steps.push(makeStep(s));
    if (!s.steps.some(Boolean)) s.steps[0] = { midi: pool[s.idx], vel: 1 };
    return s;
  }

  function stepNote(s, t) {
    // nothing is re-rolled while the button is held: same patch, same 16 steps, looped
    const st = s.steps[s.i];
    s.i = (s.i + 1) % STEPS;
    if (!st) return;
    const midi = st.midi;
    play(Object.assign({}, s.timbre, {
      oct: midi < 36 ? 1 : 2,
      semi: midi % 12,
      freq: 440 * Math.pow(2, (midi - 69) / 12),
      vel: st.vel
    }), t);
  }

  function tick() {
    const s = seq;
    if (!s) return;
    while (s.next < ctx.currentTime + 0.12) {
      stepNote(s, s.next);
      s.next += s.dur;
    }
  }

  function startMelody() {
    if (!holding || seq || !ctx) return;
    const begin = () => {
      if (!holding || seq) return;
      seq = makeSeq();
      seq.next = ctx.currentTime + 0.03;
      info.textContent = NOTES[seq.root] + ' ' + seq.sc.name + '  ·  ' + seq.bpm + ' BPM';
      go.classList.add('live');
      tick();
      seq.timer = setInterval(tick, 25);
    };
    if (ctx.state === 'running') begin(); else ctx.resume().then(begin).catch(() => {});
  }

  function stopMelody() {
    if (!seq) return;
    clearInterval(seq.timer);
    seq = null;
    info.textContent = '';
    go.classList.remove('live');
  }

  /* ---------- readout ---------- */
  const chain = $('#chain');
  const info = $('#info');
  function show(p) {
    chain.classList.remove('idle');
    $('#v-note').textContent = NOTES[p.semi] + p.oct;
    $('#v-hz').textContent = p.freq.toFixed(1) + ' Hz';
    $('#v-wave').textContent = p.wave[1];
    $('#v-fm').textContent = '×' + Number(p.fmRatio.toFixed(2)) + ' i' + p.fmIdx.toFixed(1);
    $('#f-depth').textContent = Math.round(p.depth / DEPTH_MAX * 100);
    $('#f-sym').textContent = sgn(Math.round(p.sym / SYM_MAX * 100));
    $('#f-sweep').textContent = '−' + Math.round((1 - p.sweep) * 100) + '%';
    $('#l-cut').textContent = (p.cutoff / 1000).toFixed(2);
    $('#l-dec').textContent = Math.round(p.decay * 1000) + ' ms';
    $('#l-res').textContent = Math.round(p.res) + ' dB';
    $('#o1').toggleAttribute('data-on', p.oct === 1);
    $('#o2').toggleAttribute('data-on', p.oct === 2);
  }

  /* ---------- tick ring: lit ticks follow the gate level ---------- */
  const ring = $('#ring');
  const NS = 'http://www.w3.org/2000/svg';
  const ticks = [];
  for (let i = 0; i < 60; i++) {
    const major = i % 5 === 0;
    const a = i * 6 * Math.PI / 180;
    const r1 = major ? 83 : 88, r2 = 96;
    const l = document.createElementNS(NS, 'line');
    l.setAttribute('x1', (100 + Math.sin(a) * r1).toFixed(2));
    l.setAttribute('y1', (100 - Math.cos(a) * r1).toFixed(2));
    l.setAttribute('x2', (100 + Math.sin(a) * r2).toFixed(2));
    l.setAttribute('y2', (100 - Math.cos(a) * r2).toFixed(2));
    l.setAttribute('stroke-width', major ? '2' : '1.3');
    l.dataset.major = major ? '1' : '0';
    ring.appendChild(l);
    ticks.push(l);
  }
  let litN = -1;
  function setLit(n) {
    if (n === litN) return;
    litN = n;
    for (let i = 0; i < 60; i++) {
      ticks[i].setAttribute('class', i < n ? 'on' : (ticks[i].dataset.major === '1' ? 'hi' : 'off'));
    }
  }
  setLit(0);

  /* ---------- scope ---------- */
  const cv = $('#scope');
  const g = cv.getContext('2d');
  const css = getComputedStyle(document.documentElement);
  const C = {
    tick: css.getPropertyValue('--tick').trim() || '#2a2621',
    hi: css.getPropertyValue('--tick-hi').trim() || '#5d574d',
    accent: css.getPropertyValue('--accent').trim() || '#ffab40'
  };
  let W = 0, H = 0, dpr = 1;
  const buf = new Float32Array(4096);

  function draw(data) {
    g.clearRect(0, 0, W, H);
    g.lineWidth = dpr;
    g.strokeStyle = C.tick;
    g.beginPath();
    for (let i = 1; i < 8; i++) { const x = Math.round(W * i / 8) + 0.5; g.moveTo(x, 0); g.lineTo(x, H); }
    for (let j = 1; j < 4; j++) { const y = Math.round(H * j / 4) + 0.5; g.moveTo(0, y); g.lineTo(W, y); }
    g.stroke();
    g.strokeStyle = C.hi;
    g.beginPath();
    g.moveTo(0, H / 2); g.lineTo(W, H / 2);
    g.stroke();

    g.strokeStyle = C.accent;
    g.lineWidth = 1.6 * dpr;
    g.lineJoin = 'round';
    g.beginPath();
    if (!data) {
      g.moveTo(0, H / 2); g.lineTo(W, H / 2);
    } else {
      let start = 0;
      for (let i = 1; i < 1800; i++) { if (data[i - 1] <= 0 && data[i] > 0) { start = i; break; } }
      const N = 2048, step = Math.max(1, Math.round(dpr));
      for (let x = 0; x <= W; x += step) {
        const v = data[start + Math.min(N - 1, Math.floor(x / W * (N - 1)))];
        const y = H / 2 - Math.max(-1, Math.min(1, v * 1.15)) * H * 0.46;
        if (x === 0) g.moveTo(x, y); else g.lineTo(x, y);
      }
    }
    g.stroke();
  }

  function fit() {
    dpr = Math.min(window.devicePixelRatio || 1, 3);
    W = Math.round(cv.clientWidth * dpr);
    H = Math.round(cv.clientHeight * dpr);
    cv.width = W; cv.height = H;
    draw(null);
  }
  new ResizeObserver(fit).observe(cv);
  fit();

  /* ---------- frame loop ---------- */
  let raf = 0;
  function loop() {
    raf = 0;
    if (!cur || !ctx) return;
    const t = ctx.currentTime - cur.t0;
    const env = t <= 0 ? 0 : (t < cur.a ? t / cur.a : Math.exp(-(t - cur.a) / cur.tau));
    setLit(Math.ceil(env * 60 - 1e-6));
    analyser.getFloatTimeDomainData(buf);
    draw(buf);
    if (t > cur.a + cur.tau * 7 && !seq) { setLit(0); draw(null); cur = null; return; }
    raf = requestAnimationFrame(loop);
  }

  /* ---------- input: tap = one note, hold = melody ---------- */
  const go = $('#go');
  let holding = false, holdTimer = 0;

  function down() {
    if (holding) return;
    holding = true;
    press();
    holdTimer = setTimeout(startMelody, HOLD_MS);
  }
  function up() {
    if (!holding) return;
    holding = false;
    clearTimeout(holdTimer);
    stopMelody();
  }

  go.addEventListener('pointerdown', e => {
    e.preventDefault();
    try { go.setPointerCapture(e.pointerId); } catch (err) {}
    down();
  });
  go.addEventListener('pointerup', up);
  go.addEventListener('pointercancel', up);
  go.addEventListener('lostpointercapture', up);
  go.addEventListener('contextmenu', e => e.preventDefault());
  addEventListener('blur', up);
  // iOS only unlocks audio inside click/touchend, so retry the pending trigger there
  go.addEventListener('click', () => {
    if (ctx && ctx.state !== 'running') {
      ctx.resume().then(() => { if (pending) { pending = false; fire(); } }).catch(() => {});
    }
  });
  addEventListener('keydown', e => {
    if (e.repeat) return;
    if (e.code === 'Space' || e.code === 'Enter') { e.preventDefault(); go.classList.add('down'); down(); }
  });
  addEventListener('keyup', e => {
    if (e.code === 'Space' || e.code === 'Enter') { go.classList.remove('down'); up(); }
  });
})();
</script>

</body>
</html>
