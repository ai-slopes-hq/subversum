<title>Subversum Вектор поток</title>
<style>
/* Один поток частиц на тёмном фоне. Угол экрана задаёт поле течения: завитки, изломы, кольца, сетка.
   Цвет базовый светлый, у каждого узора слабый оттенок. */
:root{--bg:#08080C;--fg:#EDEBF7;color-scheme:dark}
html,body{height:100%;margin:0;overflow:hidden;background:var(--bg);color:var(--fg)}
body{overscroll-behavior:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
#ov{pointer-events:none}
#fps{position:fixed;left:max(12px,env(safe-area-inset-left,0px));top:calc(10px + env(safe-area-inset-top,0px));font:12px/1.4 ui-monospace,Menlo,monospace;padding:6px 8px;border-radius:6px;background:rgba(0,0,0,.6);color:#EDEBF7;pointer-events:none;white-space:pre}
</style>
<canvas id="c"></canvas>
<canvas id="ov"></canvas>
<div id="fps" hidden></div>
<script>
(function () {
  var cv = document.getElementById('c'), ov = document.getElementById('ov'), fpsEl = document.getElementById('fps');
  var ctx = cv.getContext('2d', { alpha: false }), octx = ov.getContext('2d');
  var clamp = function (x, a, b) { return Math.max(a, Math.min(b, x)); };
  var sst = function (a, b, x) { x = clamp((x - a) / (b - a), 0, 1); return x * x * (3 - 2 * x); };

  var W = 1, H = 1, asp = 1, sc = 1;
  function resize() {
    sc = Math.min(window.devicePixelRatio || 1, 1.5);
    W = Math.max(1, Math.round(innerWidth * sc)); H = Math.max(1, Math.round(innerHeight * sc)); asp = W / H;
    cv.width = ov.width = W; cv.height = ov.height = H;
    ctx.fillStyle = '#08080C'; ctx.fillRect(0, 0, W, H);
  }
  addEventListener('resize', resize); resize();

  // шум
  function hash(x, y) { var n = Math.sin(x * 127.1 + y * 311.7) * 43758.5453; return n - Math.floor(n); }
  function vnoise(x, y) {
    var ix = Math.floor(x), iy = Math.floor(y), fx = x - ix, fy = y - iy;
    fx = fx * fx * (3 - 2 * fx); fy = fy * fy * (3 - 2 * fy);
    var a = hash(ix, iy), b = hash(ix + 1, iy), c = hash(ix, iy + 1), d = hash(ix + 1, iy + 1);
    return a + (b - a) * fx + (c - a) * fy + (a - b - c + d) * fx * fy;
  }

  // четыре поля течения; возвращают вектор в out[0..1]
  var T = 0, o = [0, 0];
  function fFog(u, v) {
    var a = u * 2.2 + T * .04, b = v * 2.2 - T * .03, e = .05;
    var dx = vnoise(a + e, b) - vnoise(a - e, b), dy = vnoise(a, b + e) - vnoise(a, b - e);
    var l = Math.sqrt(dx * dx + dy * dy) + 1e-3, s = Math.min(1, l * 6) * .5;
    o[0] = dy / l * s; o[1] = -dx / l * s;
  }
  function fGlass(u, v) {
    var h = hash(Math.floor(u * 3.4 + T * .01), Math.floor(v * 3.4)), a = Math.floor(h * 6) * 1.0472 + .5236;
    o[0] = Math.cos(a) * .85; o[1] = Math.sin(a) * .85;
  }
  function fWood(u, v) {
    var dx = u + .04, dy = v - 1.04, d = Math.sqrt(dx * dx + dy * dy) + 1e-4, rad = Math.sin(d * 55 - T * .6) * .18;
    o[0] = (-dy / d) * .55 + (dx / d) * rad; o[1] = (dx / d) * .55 + (dy / d) * rad;
  }
  function floor15() { return Math.floor(T * .2) * 3.7; }
  function fMetal(u, v) {
    var i = Math.floor(u * 7), j = Math.floor(v * 7);
    if (hash(i + 7, j + floor15()) < .5) { o[0] = (j & 1) ? .6 : -.6; o[1] = 0; } else { o[0] = 0; o[1] = (i & 1) ? .6 : -.6; }
  }
  var FIELDS = [fFog, fGlass, fWood, fMetal];
  // слабый оттенок у каждого узора, смешиваем с общей светлой базой
  var BASE = [200, 205, 235], TINT = [[255, 158, 122], [142, 235, 255], [255, 198, 107], [185, 180, 255]];

  var NMAX = 3000, n = 2400;
  var px = new Float32Array(NMAX), py = new Float32Array(NMAX), qx = new Float32Array(NMAX), qy = new Float32Array(NMAX);
  var vx = new Float32Array(NMAX), vy = new Float32Array(NMAX), ex = new Float32Array(NMAX), ey = new Float32Array(NMAX);
  var hot = new Float32Array(NMAX), skip = new Uint8Array(NMAX), key = new Uint8Array(NMAX);
  var order = new Uint16Array(NMAX), cnt = new Uint16Array(127);
  for (var i = 0; i < NMAX; i++) { px[i] = qx[i] = Math.random(); py[i] = qy[i] = Math.random(); }

  var S = { ptr: new Map(), target: [.5, .5], mS: [.5, .5], zStart: 0, anchor: [0, 0], zH: 0, sharp: .3, sharpS: .3,
    ang: 0, touch: 0, lastRel: -9, snapUntil: 0, snapC: [0, 0], snapS: 0, flash: 0, force: null, secondDown: null };
  var showFps = location.hash === '#fps'; fpsEl.hidden = !showFps;
  addEventListener('hashchange', function () { showFps = location.hash === '#fps'; fpsEl.hidden = !showFps; });
  var t0 = performance.now(); function now() { return (performance.now() - t0) / 1000; }

  function areas(m) { var c0 = 1 - m[0], c1 = 1 - m[1]; return [c0 * c1, (1 - c0) * c1, c0 * (1 - c1), (1 - c0) * (1 - c1)]; }
  function pickKind(m) { var w = areas(m), r = Math.random(), a = 0; for (var i = 0; i < 4; i++) { a += w[i]; if (r < a) return i; } return 3; }
  // всплеск частиц: у каждого узора свой почерк
  function burst(kind, m, count) {
    var c0 = 1 - m[0], c1 = 1 - m[1];
    var x0 = (kind & 1) ? c0 : 0, x1 = (kind & 1) ? 1 : c0, y0 = (kind & 2) ? c1 : 0, y1 = (kind & 2) ? 1 : c1;
    var bx = x0 + (x1 - x0) * Math.random(), by = y0 + (y1 - y0) * Math.random();
    for (var k = 0; k < count; k++) {
      var i = (Math.random() * n) | 0, a, s;
      if (kind === 0) { a = Math.random() * 6.283; s = .08 + Math.random() * .22; }
      else if (kind === 1) { a = Math.floor(Math.random() * 6) * 1.0472 + .5236; s = .5 + Math.random() * .7; }
      else if (kind === 2) { a = k / count * 6.283; s = .45; }
      else { a = Math.floor(Math.random() * 4) * 1.5708; s = .7 + Math.random() * .5; }
      px[i] = qx[i] = bx + (Math.random() - .5) * .01; py[i] = qy[i] = by + (Math.random() - .5) * .01;
      ex[i] = Math.cos(a) * s; ey[i] = Math.sin(a) * s; hot[i] = .35;
    }
  }
  function hit() {
    var m = S.mS, cx = m[0] > .5 ? 1 : 0, cy = m[1] > .5 ? 1 : 0;
    S.snapC = [cx, cy]; S.snapUntil = now() + .22; S.flash = 1; burst(cy * 2 + cx, [cx, cy], 90);
  }

  function pos(e) { return [e.clientX / innerWidth, e.clientY / innerHeight]; }
  ov.style.pointerEvents = 'none';
  cv.addEventListener('pointerdown', function (e) {
    try { cv.setPointerCapture(e.pointerId); } catch (_) {}
    var t = now(), p = pos(e);
    if (S.ptr.size === 0) { S.target = p; S.zStart = t; S.anchor = [e.clientX, e.clientY]; }
    else if (S.ptr.size === 1) S.secondDown = { id: e.pointerId, t: t, x: e.clientX, y: e.clientY };
    S.ptr.set(e.pointerId, { x: e.clientX, y: e.clientY });
    if (S.ptr.size === 3) { showFps = !showFps; fpsEl.hidden = !showFps; }
    e.preventDefault();
  });
  cv.addEventListener('pointermove', function (e) {
    if (!S.ptr.has(e.pointerId)) return;
    S.ptr.set(e.pointerId, { x: e.clientX, y: e.clientY });
    var keys = Array.from(S.ptr.keys());
    if (keys[0] === e.pointerId) {
      S.target = pos(e);
      if (Math.hypot(e.clientX - S.anchor[0], e.clientY - S.anchor[1]) > 24) { S.anchor = [e.clientX, e.clientY]; S.zStart = now(); }
    }
    if (S.ptr.size >= 2) { var a = S.ptr.get(keys[0]), b = S.ptr.get(keys[1]); S.sharp = clamp((Math.hypot(a.x - b.x, a.y - b.y) - 50) / 260, 0, 1); }
    e.preventDefault();
  });
  function up(e) {
    if (!S.ptr.has(e.pointerId)) return;
    var t = now(), sd = S.secondDown;
    if (sd && sd.id === e.pointerId) { if (t - sd.t < .25 && Math.hypot(e.clientX - sd.x, e.clientY - sd.y) < 20) hit(); S.secondDown = null; }
    S.ptr.delete(e.pointerId);
    if (S.ptr.size === 0) S.lastRel = t;
  }
  cv.addEventListener('pointerup', up); cv.addEventListener('pointercancel', up);
  addEventListener('wheel', function (e) { S.sharp = clamp(S.sharp - e.deltaY / 800, 0, 1); }, { passive: true });
  addEventListener('keydown', function (e) { if (e.code === 'Space') hit(); });
  window.__sv = { set: function (o) { S.force = o; }, hit: hit };

  var m = [.5, .5], grid = new Uint8Array(48 * 96);
  function step(dt) {
    grid.fill(0);
    var c0 = 1 - m[0], c1 = 1 - m[1];
    var w = .25 + (.012 - .25) * S.sharpS, gam = 1 + 2.5 * S.sharpS;
    var fu = S.mS[0] * asp, fv = S.mS[1], spd = 1 + .6 * S.zH, k = 1 - Math.exp(-dt * 8), dec = Math.exp(-dt * 3);
    var wv = [0, 0, 0, 0];
    for (var i = 0; i < n; i++) {
      var x = px[i], y = py[i], u = x * asp, v = y;
      var warp = Math.sin(y * 7 + T * .3) * .03 * (1 - S.sharpS), warp2 = Math.sin(x * 6 - T * .27) * .03 * (1 - S.sharpS);
      var sx = sst(-w, w, x - c0 + warp), sy = sst(-w, w, y - c1 + warp2);
      wv[0] = (1 - sx) * (1 - sy); wv[1] = sx * (1 - sy); wv[2] = (1 - sx) * sy; wv[3] = sx * sy;
      var sum = 0, fx = 0, fy = 0, r = 0, g = 0, b = 0, kk;
      for (kk = 0; kk < 4; kk++) wv[kk] = Math.pow(wv[kk], gam), sum += wv[kk];
      for (kk = 0; kk < 4; kk++) {
        var wk = wv[kk] / sum;
        if (wk > .02) { FIELDS[kk](u, v); fx += o[0] * wk; fy += o[1] * wk; }
        r += TINT[kk][0] * wk; g += TINT[kk][1] * wk; b += TINT[kk][2] * wk;
      }
      var dx = u - fu, dy = v - fv, fd = Math.sqrt(dx * dx + dy * dy);
      if (fd < .3 && S.touch > .02) { var s = S.touch * (1 - fd / .3); s *= s; fx += (-dy / (fd + .08)) * .02 * s * 4 + (dx / (fd + .08)) * .015 * s * 4; fy += (dx / (fd + .08)) * .02 * s * 4 + (dy / (fd + .08)) * .015 * s * 4; }
      vx[i] += (fx * spd - vx[i]) * k; vy[i] += (fy * spd - vy[i]) * k;
      qx[i] = x; qy[i] = y;
      x += (vx[i] + ex[i]) * dt / asp; y += (vy[i] + ey[i]) * dt;
      ex[i] *= dec; ey[i] *= dec; if (hot[i] > 0) hot[i] -= dt;
      skip[i] = 0;
      var gi = (clamp(y, 0, .999) * 96 | 0) * 48 + (clamp(x, 0, .999) * 48 | 0), crowd = ++grid[gi] > 9 && hot[i] <= 0;
      if (crowd || x < -.02 || x > 1.02 || y < -.02 || y > 1.02 || Math.random() < .008) { x = Math.random(); y = Math.random(); qx[i] = x; qy[i] = y; skip[i] = 1; vx[i] = vy[i] = ex[i] = ey[i] = 0; hot[i] = 0; }
      px[i] = x; py[i] = y;
      // цвет: база плюс слабый оттенок угла, 5 уровней на канал
      r = BASE[0] * .25 + r * .75; g = BASE[1] * .25 + g * .75; b = BASE[2] * .25 + b * .75;
      key[i] = hot[i] > 0 ? 125 : Math.round(r / 255 * 4) * 25 + Math.round(g / 255 * 4) * 5 + Math.round(b / 255 * 4);
    }
  }
  function draw(fade) {
    ctx.globalCompositeOperation = 'source-over';
    ctx.fillStyle = 'rgba(8,8,12,' + fade + ')'; ctx.fillRect(0, 0, W, H);
    ctx.globalCompositeOperation = 'lighter'; ctx.lineCap = 'round';
    var i, kk;
    cnt.fill(0);
    for (i = 0; i < n; i++) cnt[key[i] + 1]++;
    for (kk = 1; kk < 127; kk++) cnt[kk] += cnt[kk - 1];
    var cur = cnt.slice(); // cur[kk] = начало корзины kk
    for (i = 0; i < n; i++) order[cur[key[i]]++] = i;
    for (kk = 0; kk <= 125; kk++) {
      var a = cnt[kk], bnd = cnt[kk + 1];
      if (bnd <= a) continue;
      if (kk === 125) { ctx.strokeStyle = 'rgba(255,255,255,.95)'; ctx.lineWidth = 2.2 * sc; }
      else {
        var rr = Math.floor(kk / 25), gg = Math.floor((kk % 25) / 5), bb = kk % 5;
        ctx.strokeStyle = 'rgba(' + Math.round(rr * 63.75) + ',' + Math.round(gg * 63.75) + ',' + Math.round(bb * 63.75) + ',.4)'; ctx.lineWidth = 1.3 * sc;
      }
      ctx.beginPath();
      for (var j = a; j < bnd; j++) { var p = order[j]; if (skip[p]) continue; ctx.moveTo(qx[p] * W, qy[p] * H); ctx.lineTo(px[p] * W, py[p] * H); }
      ctx.stroke();
    }
  }
  function drawFinger() {
    octx.clearRect(0, 0, W, H);
    if (S.touch < .02) return;
    var x = S.mS[0] * W, y = S.mS[1] * H, r = .07 * W;
    var gr = octx.createRadialGradient(x, y, 0, x, y, r * 2.2);
    gr.addColorStop(0, 'rgba(255,255,255,' + (.2 * S.touch) + ')'); gr.addColorStop(1, 'rgba(255,255,255,0)');
    octx.fillStyle = gr; octx.beginPath(); octx.arc(x, y, r * 2.2, 0, 6.2832); octx.fill();
    octx.strokeStyle = 'rgba(255,255,255,' + (.75 * S.touch) + ')'; octx.lineWidth = 1.6 * sc;
    octx.beginPath(); octx.arc(x, y, r * .5, 0, 6.2832); octx.stroke();
  }

  var last = now(), noteT = 0, frames = 0, acc = 0, lowCount = 0, started = now();
  function frame() {
    var t = now(), dt = Math.min(.05, t - last); last = t; T = t;
    var touching = S.ptr.size > 0, F = S.force, idle = !touching && t - S.lastRel > 3;
    if (F) { S.target = F.m; S.mS = F.m.slice(); S.zH = F.z || 0; S.sharp = F.sharp != null ? F.sharp : S.sharp; S.sharpS = S.sharp; touching = !!F.touch; }
    else {
      if (idle) S.target = [.5 + .3 * Math.sin(t * .13), .5 + .3 * Math.cos(t * .17)];
      var rate = touching ? 10 : (idle ? 1.2 : 4), k = 1 - Math.exp(-dt * rate);
      S.mS[0] += (S.target[0] - S.mS[0]) * k; S.mS[1] += (S.target[1] - S.mS[1]) * k;
      if (touching) S.zH = sst(0, 1, (t - S.zStart - 1) / 11); else S.zH *= Math.exp(-dt * 2.5);
      S.sharpS += (S.sharp - S.sharpS) * (1 - Math.exp(-dt * 8));
    }
    S.touch += ((touching ? 1 : 0) - S.touch) * (1 - Math.exp(-dt * 10));
    S.ang += dt * .9;
    var r = .22 * S.zH + (idle ? .05 : 0);
    var mb = [clamp(S.mS[0] + r * Math.cos(S.ang), 0, 1), clamp(S.mS[1] + r * Math.sin(S.ang), 0, 1)];
    S.snapS += ((t < S.snapUntil ? 1 : 0) - S.snapS) * (1 - Math.exp(-dt * 18));
    m = [mb[0] + (S.snapC[0] - mb[0]) * S.snapS, mb[1] + (S.snapC[1] - mb[1]) * S.snapS];
    noteT -= dt;
    if (noteT <= 0) { noteT = .22; if (Math.random() < .65) burst(pickKind(m), m, 18); }
    step(dt);
    draw(.12 - .05 * S.zH);
    drawFinger();
    if (t - started > 2) {
      acc += dt; frames++;
      if (frames === 60) {
        var avg = acc / frames * 1000;
        if (avg > 22) { lowCount++; if (lowCount >= 2 && n > 900) { n = Math.max(900, Math.floor(n * .85)); lowCount = 0; } } else lowCount = 0;
        if (showFps) fpsEl.textContent = 'fps ' + (1000 / avg).toFixed(0) + '\nms  ' + avg.toFixed(1) + '\nn   ' + n;
        frames = 0; acc = 0;
      }
    }
    requestAnimationFrame(frame);
  }
  // прогрев: к первому кадру на экране уже есть следы
  for (var w0 = 0; w0 < 70; w0++) { T = w0 / 30; step(1 / 30); draw(.12); }
  requestAnimationFrame(frame);
})();
</script>
