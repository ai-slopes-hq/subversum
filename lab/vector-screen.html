<title>Subversum Вектор</title>
<style>
/* Один тёмный экран на весь вьюпорт: четыре материала, которые делят экран по весам микса.
   Палитра задана в шейдере: туман #FF9E7A, стекло #8EEBFF, дерево #FFC66B, металл #B9B4FF. */
:root{--bg:#08080C;--fg:#EDEBF7;color-scheme:dark}
html,body{height:100%;margin:0;overflow:hidden;background:var(--bg);color:var(--fg)}
body{overscroll-behavior:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
#c{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;background:var(--bg)}
#fps{position:fixed;left:max(12px,env(safe-area-inset-left,0px));top:calc(10px + env(safe-area-inset-top,0px));font:12px/1.4 ui-monospace,Menlo,monospace;padding:6px 8px;border-radius:6px;background:rgba(0,0,0,.6);color:#EDEBF7;pointer-events:none;white-space:pre}
#err[hidden]{display:none}
#err{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:24px;font:15px/1.5 system-ui,sans-serif;text-align:center;color:var(--fg)}
</style>
<canvas id="c"></canvas>
<div id="fps" hidden></div>
<div id="err" hidden>На этом устройстве не запустился WebGL.</div>
<script>
(function () {
  var cv = document.getElementById('c'), fpsEl = document.getElementById('fps'), errEl = document.getElementById('err');
  var gl = cv.getContext('webgl', { antialias: false, alpha: false, powerPreference: 'high-performance' });
  if (!gl) { errEl.hidden = false; return; }

  var VS = 'attribute vec2 a;void main(){gl_Position=vec4(a,0.,1.);}';
  var FS = [
'precision highp float;',
'uniform vec2 uRes;uniform float uT;uniform vec2 uM;uniform vec2 uF;uniform float uTouch;uniform float uSharp;uniform float uFlash;uniform vec4 uSp[8];',
'float h21(vec2 p){p=fract(p*vec2(123.34,456.21));p+=dot(p,p+45.32);return fract(p.x*p.y);}',
'vec2 h22(vec2 p){float n=h21(p);return vec2(n,h21(p+n+17.0));}',
'float vn(vec2 p){vec2 i=floor(p),f=fract(p);f=f*f*(3.-2.*f);return mix(mix(h21(i),h21(i+vec2(1.,0.)),f.x),mix(h21(i+vec2(0.,1.)),h21(i+vec2(1.,1.)),f.x),f.y);}',
'float fbm(vec2 p){float a=.5,s=0.;for(int i=0;i<4;i++){s+=a*vn(p);p=p*2.02+vec2(5.2,1.3);a*=.5;}return s;}',
// туман: тёплый дым с доменным искажением
'vec3 fog(vec2 q,float t){',
' vec2 r=vec2(fbm(q*3.+t*.04),fbm(q*3.+vec2(3.7,9.2)-t*.03));',
' float f=fbm(q*3.+2.6*r+t*.02);',
' float g=fbm(q*6.+3.*r-t*.03);',
' vec3 c=mix(vec3(.16,.07,.17),vec3(1.,.62,.46),smoothstep(.22,.78,f));',
' c=mix(c,vec3(1.,.82,.66),smoothstep(.55,.9,g)*smoothstep(.4,.8,f)*.7);',
' c+=vec3(1.,.38,.58)*smoothstep(.45,.9,r.x)*.45;',
' return c*.95;}',
// стекло: грани Вороного, яркие рёбра, блики
'vec3 glass(vec2 q,float t){',
' vec2 g=q*7.,id=floor(g),f=fract(g);float d1=9.,d2=9.;vec2 best=vec2(0.);',
' for(int j=-1;j<=1;j++)for(int i=-1;i<=1;i++){',
'  vec2 o=vec2(float(i),float(j));vec2 r=h22(id+o);r=.5+.45*sin(t*.35+6.2831*r);',
'  vec2 dv=o+r-f;float d=dot(dv,dv);',
'  if(d<d1){d2=d1;d1=d;best=id+o;}else if(d<d2){d2=d;}}',
' float e=smoothstep(.07,.0,sqrt(d2)-sqrt(d1));',
' float fh=h21(best);float fac=.5+.5*sin(t*.4+fh*30.);',
' vec3 b=mix(vec3(.02,.07,.11),vec3(.10,.38,.48),fh*.7+.3*fac);',
' return b+vec3(.55,.92,1.)*e*.8+vec3(.4,.8,1.)*pow(fac,6.)*.25*step(.6,fh);}',
// дерево: годовые кольца вокруг нижнего левого угла + волокно
'vec3 wood(vec2 q,float t){',
' vec2 v=(q-vec2(-.10,1.10))*vec2(1.,.85);float d=length(v);float an=atan(v.y,v.x);',
' float w=fbm(q*5.+vec2(0.,t*.02))*.10+sin(t*.3)*.006;',
' float rr=sin((d+w)*95.)*.5+.5;',
' float r=smoothstep(.15,.85,rr);',
' float grain=vn(vec2(d*260.,an*4.))*.35+vn(vec2(d*40.,an*30.))*.15;',
' vec3 c=mix(vec3(.30,.15,.05),vec3(.98,.68,.30),clamp(r*.5+grain*.45,0.,1.));',
' c*=.8+.2*smoothstep(.0,1.2,d);',
' return c*.95;}',
// металл: сетка точек, щётка, мерцающие искры
'vec3 metal(vec2 q,float t){',
' vec2 g=q*26.,id=floor(g),f=fract(g);',
' float h=h21(id);float len=length(f-.5);float dots=smoothstep(.24,.12,len);',
' float tw=pow(.5+.5*sin(t*(1.5+3.*h)+h*40.),12.);',
' float brush=vn(vec2(q.x*2.,q.y*180.))*.07;',
' vec3 c=vec3(.035,.035,.10)+brush;',
' c+=vec3(.45,.42,.85)*dots*.5;',
' c+=vec3(.9,.9,1.)*tw*step(.8,h)*dots*1.3;',
' return c;}',
'void main(){',
' vec2 p=vec2(gl_FragCoord.x/uRes.x,1.-gl_FragCoord.y/uRes.y);',
' float asp=uRes.x/uRes.y;vec2 q=vec2(p.x*asp,p.y);float t=uT;',
// стык материалов лежит в 1-m: площадь материала равна его весу в звуке
' vec2 c=1.-uM;',
' float w=mix(.30,.014,uSharp);float amp=mix(.20,.025,uSharp);',
' float nx=fbm(q*2.4+vec2(t*.05,3.1))-.5;float ny=fbm(q*2.4+vec2(8.4,t*.05))-.5;',
' float sx=smoothstep(-w,w,p.x-c.x+nx*amp*2.);',
' float sy=smoothstep(-w,w,p.y-c.y+ny*amp*2.);',
' float wA=(1.-sx)*(1.-sy),wB=sx*(1.-sy),wC=(1.-sx)*sy,wD=sx*sy;',
' vec3 col=vec3(0.);',
' if(wA>.01)col+=wA*fog(q,t);',
' if(wB>.01)col+=wB*glass(q,t);',
' if(wC>.01)col+=wC*wood(q,t);',
' if(wD>.01)col+=wD*metal(q,t);',
// шов на стыке: мягкий при слитном, резкий при разведённом пинче
' float seam=4.*sx*(1.-sx)+4.*sy*(1.-sy);',
' col+=vec3(.9,.92,1.)*seam*(.03+.2*uSharp*uSharp);',
// искры от нот: у каждого материала свой почерк
' for(int i=0;i<8;i++){',
'  vec4 s=uSp[i];if(s.z<0.)continue;',
'  float a=s.z;float d=length(q-vec2(s.x*asp,s.y));',
'  if(s.w<.5)col+=vec3(1.,.6,.5)*exp(-d*d/(.02+a*.07))*(1.-a)*.35;',
'  else if(s.w<1.5)col+=vec3(.6,.95,1.)*smoothstep(.012,0.,abs(d-a*.35))*(1.-a)*.9;',
'  else if(s.w<2.5)col+=vec3(1.,.72,.3)*smoothstep(.03,0.,abs(d-a*.18))*(1.-a)*.6;',
'  else col+=vec3(.85,.85,1.)*exp(-d*d/.0009)*(1.-a)*1.3;}',
// палец
' float dF=length(q-vec2(uF.x*asp,uF.y));',
' col+=(smoothstep(.006,0.,abs(dF-.035))*.7+exp(-dF*dF/.004)*.22)*uTouch;',
' col*=1.+uFlash*.5;',
' col*=1.-.7*dot(p-.5,p-.5);',
' col+=(h21(gl_FragCoord.xy+t)-.5)/255.;',
' gl_FragColor=vec4(col,1.);}'
  ].join('\n');

  function sh(type, src) {
    var s = gl.createShader(type); gl.shaderSource(s, src); gl.compileShader(s);
    if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) { errEl.textContent = gl.getShaderInfoLog(s); errEl.hidden = false; console.error(gl.getShaderInfoLog(s)); return null; }
    return s;
  }
  var vs = sh(gl.VERTEX_SHADER, VS), fs = sh(gl.FRAGMENT_SHADER, FS);
  if (!vs || !fs) return;
  var pr = gl.createProgram(); gl.attachShader(pr, vs); gl.attachShader(pr, fs); gl.linkProgram(pr);
  if (!gl.getProgramParameter(pr, gl.LINK_STATUS)) { errEl.textContent = gl.getProgramInfoLog(pr); errEl.hidden = false; return; }
  gl.useProgram(pr);
  var buf = gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER, buf);
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 3, -1, -1, 3]), gl.STATIC_DRAW);
  var loc = gl.getAttribLocation(pr, 'a'); gl.enableVertexAttribArray(loc); gl.vertexAttribPointer(loc, 2, gl.FLOAT, false, 0, 0);
  var U = {}; ['uRes', 'uT', 'uM', 'uF', 'uTouch', 'uSharp', 'uFlash', 'uSp'].forEach(function (n) { U[n] = gl.getUniformLocation(pr, n); });

  var clamp = function (x, a, b) { return Math.max(a, Math.min(b, x)); };
  var sstep = function (a, b, x) { x = clamp((x - a) / (b - a), 0, 1); return x * x * (3 - 2 * x); };

  // разрешение: стартуем с 0.75 css-пикселя и опускаемся, если кадр дорогой
  var scale = 0.75, W = 1, H = 1;
  function resize() {
    var w = Math.max(1, Math.round(innerWidth * scale)), h = Math.max(1, Math.round(innerHeight * scale));
    if (w !== W || h !== H) { W = w; H = h; cv.width = W; cv.height = H; gl.viewport(0, 0, W, H); }
  }
  addEventListener('resize', resize); resize();

  var S = {
    ptr: new Map(), target: [.5, .5], mS: [.5, .5], base: [.5, .5], zStart: 0, anchor: [0, 0], zH: 0,
    sharp: .3, sharpS: .3, ang: 0, touch: 0, lastRel: -9, snapUntil: 0, snapC: [0, 0], snapS: 0, flash: 0,
    force: null, secondDown: null
  };
  var sparks = []; // {x,y,age,life,kind}
  var showFps = location.hash === '#fps';
  fpsEl.hidden = !showFps;
  addEventListener('hashchange', function () { showFps = location.hash === '#fps'; fpsEl.hidden = !showFps; });

  function weights(m) { var c = [1 - m[0], 1 - m[1]]; return { c: c, w: [c[0] * c[1], (1 - c[0]) * c[1], c[0] * (1 - c[1]), (1 - c[0]) * (1 - c[1])] }; }
  var LIFE = [1.7, .9, .6, .5];
  function emit(kind, m) {
    var c = 1 - m[0], d = 1 - m[1], x, y, r = Math.random;
    var x0 = (kind === 0 || kind === 2) ? 0 : c, x1 = (kind === 0 || kind === 2) ? c : 1;
    var y0 = (kind === 0 || kind === 1) ? 0 : d, y1 = (kind === 0 || kind === 1) ? d : 1;
    x = x0 + (x1 - x0) * r(); y = y0 + (y1 - y0) * r();
    sparks.push({ x: x, y: y, age: 0, life: LIFE[kind], kind: kind });
    if (sparks.length > 8) sparks.shift();
  }
  function pickKind(m) {
    var wt = weights(m).w, r = Math.random(), a = 0;
    for (var i = 0; i < 4; i++) { a += wt[i]; if (r < a) return i; }
    return 3;
  }
  function hit() {
    var m = S.mS, cx = m[0] > .5 ? 1 : 0, cy = m[1] > .5 ? 1 : 0;
    S.snapC = [cx, cy]; S.snapUntil = now() + .22; S.flash = 1;
    emit(cy * 2 + cx, [cx, cy]); emit(cy * 2 + cx, [cx, cy]);
  }
  var t0 = performance.now();
  function now() { return (performance.now() - t0) / 1000; }

  function pos(e) { return [e.clientX / innerWidth, e.clientY / innerHeight]; }
  cv.addEventListener('pointerdown', function (e) {
    try { cv.setPointerCapture(e.pointerId); } catch (_) {}
    var t = now(), p = pos(e);
    if (S.ptr.size === 0) { S.target = p; S.zStart = t; S.anchor = [e.clientX, e.clientY]; }
    else if (S.ptr.size === 1) { S.secondDown = { id: e.pointerId, t: t, x: e.clientX, y: e.clientY }; }
    S.ptr.set(e.pointerId, { x: e.clientX, y: e.clientY });
    if (S.ptr.size === 3) { showFps = !showFps; fpsEl.hidden = !showFps; }
    e.preventDefault();
  });
  cv.addEventListener('pointermove', function (e) {
    if (!S.ptr.has(e.pointerId)) return;
    S.ptr.set(e.pointerId, { x: e.clientX, y: e.clientY });
    var keys = Array.from(S.ptr.keys());
    if (keys[0] === e.pointerId) {
      S.target = pos(e);
      if (Math.hypot(e.clientX - S.anchor[0], e.clientY - S.anchor[1]) > 24) { S.anchor = [e.clientX, e.clientY]; S.zStart = now(); }
    }
    if (S.ptr.size >= 2) {
      var a = S.ptr.get(keys[0]), b = S.ptr.get(keys[1]);
      S.sharp = clamp((Math.hypot(a.x - b.x, a.y - b.y) - 50) / 260, 0, 1);
    }
    e.preventDefault();
  });
  function up(e) {
    if (!S.ptr.has(e.pointerId)) return;
    var t = now(), sd = S.secondDown;
    if (sd && sd.id === e.pointerId) {
      if (t - sd.t < .25 && Math.hypot(e.clientX - sd.x, e.clientY - sd.y) < 20) hit();
      S.secondDown = null;
    }
    S.ptr.delete(e.pointerId);
    if (S.ptr.size === 0) S.lastRel = t;
  }
  cv.addEventListener('pointerup', up); cv.addEventListener('pointercancel', up);
  // для десктопа: колесо = пинч, пробел = тап
  addEventListener('wheel', function (e) { S.sharp = clamp(S.sharp - e.deltaY / 800, 0, 1); }, { passive: true });
  addEventListener('keydown', function (e) { if (e.code === 'Space') hit(); });

  // тест-крючок для проверки состояний без пальцев
  window.__sv = {
    set: function (o) { S.force = o; },
    hit: hit
  };

  var last = now(), noteT = 0, frames = 0, acc = 0, slow = 0, lowCount = 0, fpsAcc = 0, fpsN = 0, started = now();
  var sp = new Float32Array(32);

  function frame() {
    var t = now(), dt = Math.min(.05, t - last); last = t;
    var touching = S.ptr.size > 0, F = S.force;
    var idle = !touching && t - S.lastRel > 3;
    if (F) { S.target = F.m; S.mS = F.m.slice(); S.zH = F.z || 0; S.sharp = F.sharp != null ? F.sharp : S.sharp; S.sharpS = S.sharp; touching = !!F.touch; }
    else {
      if (idle) S.target = [.5 + .3 * Math.sin(t * .13), .5 + .3 * Math.cos(t * .17)];
      var rate = touching ? 10 : (idle ? 1.2 : 4), k = 1 - Math.exp(-dt * rate);
      S.mS[0] += (S.target[0] - S.mS[0]) * k; S.mS[1] += (S.target[1] - S.mS[1]) * k;
      if (touching) S.zH = sstep(0, 1, (t - S.zStart - 1) / 11); else S.zH *= Math.exp(-dt * 2.5);
      S.sharpS += (S.sharp - S.sharpS) * (1 - Math.exp(-dt * 8));
    }
    S.touch += ((touching ? 1 : 0) - S.touch) * (1 - Math.exp(-dt * 10));
    // орбита микса вокруг пальца: радиус растёт с Z
    S.ang += dt * .9;
    var r = .22 * S.zH + (idle ? .05 : 0);
    var mb = [clamp(S.mS[0] + r * Math.cos(S.ang), 0, 1), clamp(S.mS[1] + r * Math.sin(S.ang), 0, 1)];
    S.snapS += ((t < S.snapUntil ? 1 : 0) - S.snapS) * (1 - Math.exp(-dt * 18));
    var m = [mb[0] + (S.snapC[0] - mb[0]) * S.snapS, mb[1] + (S.snapC[1] - mb[1]) * S.snapS];
    S.flash *= Math.exp(-dt * 6);

    // условный секвенсор для картинки: нота раз в 0.22 с, материал выбирается по весу
    noteT -= dt;
    if (noteT <= 0) { noteT = .22; if (Math.random() < .65) emit(pickKind(m), m); }
    for (var i = sparks.length - 1; i >= 0; i--) { sparks[i].age += dt / sparks[i].life; if (sparks[i].age >= 1) sparks.splice(i, 1); }
    for (var j = 0; j < 8; j++) {
      var s = sparks[j];
      sp[j * 4] = s ? s.x : 0; sp[j * 4 + 1] = s ? s.y : 0; sp[j * 4 + 2] = s ? s.age : -1; sp[j * 4 + 3] = s ? s.kind : 0;
    }

    resize();
    gl.uniform2f(U.uRes, W, H); gl.uniform1f(U.uT, t); gl.uniform2f(U.uM, m[0], m[1]);
    gl.uniform2f(U.uF, S.mS[0], S.mS[1]); gl.uniform1f(U.uTouch, S.touch);
    gl.uniform1f(U.uSharp, S.sharpS); gl.uniform1f(U.uFlash, S.flash); gl.uniform4fv(U.uSp, sp);
    gl.drawArrays(gl.TRIANGLES, 0, 3);

    // замер кадра и снижение разрешения при просадке
    if (t - started > 2) {
      acc += dt; frames++;
      if (frames === 60) {
        var avg = acc / frames * 1000; fpsAcc = 1000 / avg; fpsN = avg;
        if (avg > 22) { lowCount++; if (lowCount >= 2 && scale > .4) { scale = Math.round((scale - .1) * 100) / 100; lowCount = 0; } } else lowCount = 0;
        frames = 0; acc = 0;
        if (showFps) fpsEl.textContent = 'fps ' + fpsAcc.toFixed(0) + '\nms  ' + fpsN.toFixed(1) + '\nres ' + W + 'x' + H + ' (' + scale + ')';
      }
    }
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>
