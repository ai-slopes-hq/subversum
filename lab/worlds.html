<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>worlds lab</title>
<style>
html,body{margin:0;height:100%;background:#000;overflow:hidden;touch-action:none}
canvas{display:block;width:100vw;height:100vh}
body.sheet{overflow:auto;height:auto}
body.sheet canvas{width:auto;height:auto}
#lab{position:fixed;left:8px;top:8px;color:#fff8;font:11px/1.3 monospace;pointer-events:none;display:none;white-space:pre}
.dbg #lab{display:block}
#sheetwrap{position:relative;display:inline-block}
#sheetwrap span{position:absolute;color:#fffc;font:10px monospace;text-shadow:0 0 3px #000,0 0 3px #000;pointer-events:none}
</style></head><body>
<div id="lab"></div>
<script>
// Worlds lab: one full-screen fragment shader; a world is a seed. A seed picks a field (the pattern), a warp, a render mode, a palette and a post treatment.
// Contract with the sound: finger (uF, uDown), kick pulse (uKick), hue (from the palette). Tap = a new seed; held finger = push and glow.
const Q = new URLSearchParams(location.search);
const SHEET = Q.has('sheet');
if (Q.has('debug')) document.documentElement.classList.add('dbg');
const VS = 'attribute vec2 a;void main(){gl_Position=vec4(a,0.,1.);}';
const FS = `
precision highp float;
uniform vec2 uRes, uF;
uniform float uT, uDown, uKick, uGrain, uGlow, uVig, uLevels, uWarpAmt, uScale, uSpeed, uSoft, uA, uB, uC, uSeedF;
uniform int uField, uMode;
uniform vec3 c0, c1, c2, c3;
#define TAU 6.2831853
float h11(float n){ return fract(sin(n * 127.1) * 43758.5453); }
vec2 h22(vec2 p){ p = vec2(dot(p, vec2(127.1, 311.7)), dot(p, vec2(269.5, 183.3))); return fract(sin(p) * 43758.5453); }
float h21(vec2 p){ return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453); }
float vnoise(vec2 p){ vec2 i = floor(p), f = fract(p); f = f * f * (3. - 2. * f);
  return mix(mix(h21(i), h21(i + vec2(1, 0)), f.x), mix(h21(i + vec2(0, 1)), h21(i + vec2(1, 1)), f.x), f.y); }
float fbm(vec2 p){ float a = .5, s = 0.; for (int i = 0; i < 4; i++) { s += a * vnoise(p); p = p * 2.03 + 17.1; a *= .5; } return s; }
mat2 rot(float a){ float c = cos(a), s = sin(a); return mat2(c, -s, s, c); }
float sstep(float a, float b, float x){ return smoothstep(a, b, x); }

// each field returns (v, w): v is the main 0..1 value, w a secondary one
vec2 fVoronoi(vec2 p, float t){
  vec2 g = floor(p), f = fract(p); float d1 = 8., d2 = 8.; float id = 0.;
  for (int j = -1; j <= 1; j++) for (int i = -1; i <= 1; i++) {
    vec2 o = vec2(float(i), float(j)), r = h22(g + o);
    r = .5 + .45 * sin(t * (.4 + r * .8) + TAU * r);
    float d = length(o + r - f);
    if (d < d1) { d2 = d1; d1 = d; id = h21(g + o); } else if (d < d2) d2 = d;
  }
  return vec2(clamp(d1 * 1.2, 0., 1.), clamp((d2 - d1) * 2.2, 0., 1.) * .6 + id * .4);
}
vec2 fWarp(vec2 p, float t){
  vec2 q = vec2(fbm(p + t * .1), fbm(p + vec2(5.2, 1.3) - t * .08));
  float v = fbm(p + 2.2 * q + t * .05);
  return vec2(v * 1.25, length(q));
}
vec2 fTruchet(vec2 p, float t){
  vec2 g = floor(p), f = fract(p); float r = h21(g);
  if (r > .5) f.x = 1. - f.x;
  float d = min(abs(length(f) - .5), abs(length(f - 1.) - .5));
  float v = 1. - sstep(.0, .24 + .06 * sin(t * .6), d);
  return vec2(v, h21(g + 3.7));
}
vec2 fRings(vec2 p, float t){
  float s = 0.;
  for (int i = 0; i < 3; i++) { float fi = float(i); vec2 c = vec2(sin(t * (.13 + fi * .07) + fi * 2.1), cos(t * (.11 + fi * .05) + fi * 1.3)) * .9;
    s += sin(length(p - c) * (5. + fi * 2.) - t * (.8 + fi * .3)); }
  return vec2(.5 + .5 * s / 2.2, .5 + .5 * sin(length(p) * 2.));
}
vec2 fMeta(vec2 p, float t){
  float s = 0.;
  for (int i = 0; i < 6; i++) { float fi = float(i); vec2 c = vec2(sin(t * (.2 + fi * .06) + fi * 1.7), cos(t * (.17 + fi * .05) + fi * 2.3)) * (.7 + .15 * fi);
    float r = .12 + .05 * h11(fi + 3.); s += r * r / (dot(p - c, p - c) + .001); }
  return vec2(clamp(s * .5, 0., 1.), clamp(s * .12, 0., 1.));
}
vec2 fStripes(vec2 p, float t){
  p = rot(uA * 3.14) * p;
  float w = fbm(p * .8 + t * .05) * 2.5;
  return vec2(.5 + .5 * sin(p.y * 6. + w * 3. - t * .3), w * .4);
}
vec2 fDots(vec2 p, float t){
  vec2 g = floor(p), f = fract(p) - .5; float r = h21(g);
  float wave = .5 + .5 * sin(length(g) * .6 - t * .8 + r * 2.);
  float d = length(f); float rad = .12 + .36 * wave;
  return vec2(1. - sstep(rad - .12, rad + .04, d), r);
}
vec2 fKaleido(vec2 p, float t){
  float n = 3. + floor(uB * 6.);
  float a = atan(p.y, p.x), r = length(p);
  a = abs(mod(a, TAU / n) - TAU / n * .5);
  vec2 q = vec2(cos(a), sin(a)) * r;
  float v = fbm(q * 2.2 + vec2(t * .08, -t * .06));
  return vec2(v * 1.3, .5 + .5 * sin(r * 5. - t * .5));
}
vec2 fHex(vec2 p, float t){
  vec2 s = vec2(1., 1.7320508); vec2 a = mod(p, s) - s * .5, b = mod(p - s * .5, s) - s * .5;
  vec2 gv = dot(a, a) < dot(b, b) ? a : b; vec2 id = floor((p - gv) * 50. + .5) / 50.;
  float d = max(abs(gv.x) * .866 + abs(gv.y) * .5, abs(gv.y));
  float pulse = .5 + .5 * sin(h21(id) * TAU + t * .7 + length(id) * .5);
  return vec2(1. - sstep(.1, .52, d + (1. - pulse) * .28), h21(id));
}
vec2 fSpiral(vec2 p, float t){
  float r = length(p), a = atan(p.y, p.x);
  float arms = 2. + floor(uB * 4.);
  float v = .5 + .5 * sin(a * arms + log(r + .05) * (4. + 6. * uC) - t * .6);
  return vec2(v * (1. - sstep(.2, 1.7, r) * .5), .5 + .5 * cos(r * 4. - t * .3));
}
vec2 fPlasma(vec2 p, float t){
  float v = sin(p.x * 3. + t * .4) + sin(p.y * 3.2 - t * .3) + sin((p.x + p.y) * 2.4 + t * .25) + sin(length(p) * 4. - t * .5);
  return vec2(.5 + .25 * v, .5 + .5 * sin(v * 1.5));
}
vec2 fWorms(vec2 p, float t){
  float v = fbm(p * 1.4 + vec2(t * .05, 0.) + fbm(p * 2.2 - t * .04) * 1.6);
  return vec2(1. - sstep(0., .2 + .12 * uC, abs(v - .5)), v);
}
vec2 field(vec2 p, float t){
  if (uField == 0) return fVoronoi(p * 1.8, t);
  if (uField == 1) return fWarp(p * 1.2, t);
  if (uField == 2) return fTruchet(p * 2.2, t);
  if (uField == 3) return fRings(p, t);
  if (uField == 4) return fMeta(p, t);
  if (uField == 5) return fStripes(p, t);
  if (uField == 6) return fDots(p * 3.2, t);
  if (uField == 7) return fKaleido(p, t);
  if (uField == 8) return fHex(p * 2.4, t);
  if (uField == 9) return fSpiral(p, t);
  if (uField == 10) return fPlasma(p, t);
  return fWorms(p, t);
}
vec3 ramp(float v){
  v = clamp(v, 0., 1.) * 3.;
  vec3 c = mix(c0, c1, sstep(0., 1., v));
  c = mix(c, c2, sstep(1., 2., v));
  return mix(c, c3, sstep(2., 3., v));
}
void main(){
  vec2 p = (gl_FragCoord.xy - .5 * uRes) / uRes.y * 2.;
  vec2 fp = (uF - .5) * vec2(uRes.x / uRes.y, 1.) * 2.;
  float t = uT * uSpeed;
  // finger: a soft push away from it, stronger on every note
  vec2 d = p - fp; float r = length(d);
  p += d / (r + .18) * exp(-r * 2.2) * .22 * uDown * (.6 + uKick);
  // global warp of the plane
  p += uWarpAmt * (vec2(fbm(p * 1.1 + t * .05), fbm(p * 1.1 + 9.7 - t * .04)) - .5);
  p *= uScale;
  vec2 vw = field(p, t);
  float v = vw.x, w = vw.y;
  vec3 col;
  if (uMode == 0) {                       // smooth ramp, the second value tints
    col = mix(ramp(v), c3, w * .22 * uSoft);
  } else if (uMode == 1) {                // posterized levels, with soft edges
    float L = uLevels; float x = v * L; float q = floor(x); float f = fract(x);
    float s = q + sstep(.5 - .25 * uSoft, .5 + .25 * uSoft, f);
    col = ramp(s / L);
  } else if (uMode == 2) {                // iso lines on the dark ground
    float L = uLevels * 2.; float x = fract(v * L);
    float line = 1. - sstep(.0, .12 + .1 * uSoft, abs(x - .5) * 2. - .0);
    line = 1. - sstep(.04, .04 + .14 * uSoft, abs(x - .5));
    col = mix(c0, mix(c2, c3, w), line * (.6 + .4 * v));
    col += c1 * .25 * v;
  } else {                                // halftone dots of the value
    vec2 g = rot(.6) * gl_FragCoord.xy / (uRes.y * (.014 + .02 * uSoft));
    vec2 f = fract(g) - .5; float rad = sqrt(clamp(v, 0., 1.)) * .62;
    float dot_ = 1. - sstep(rad - .12, rad + .05, length(f));
    col = mix(c0 + c1 * .25 * v, mix(c2, c3, w), dot_);
  }
  // glow where the value is high, the finger lights the ground, notes lift everything
  col += c3 * pow(clamp(v - .55, 0., 1.), 2.) * uGlow;
  col += c2 * exp(-length((gl_FragCoord.xy / uRes.y * 2.) - (uF * vec2(uRes.x / uRes.y, 1.) * 2.)) * 3.2) * .28 * uDown;
  col *= 1. + .25 * uKick;
  vec2 q = gl_FragCoord.xy / uRes - .5; col *= 1. - uVig * dot(q, q) * 2.2;
  col += (h21(gl_FragCoord.xy + uT) - .5) * uGrain;
  gl_FragColor = vec4(max(col, 0.), 1.);
}`;
function mulberry(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
function hsl(h,s,l){h=((h%360)+360)%360/360;const f=(n)=>{const k=(n+h*12)%12,a=s*Math.min(l,1-l);return l-a*Math.max(-1,Math.min(k-3,Math.min(9-k,1)));};return [f(0),f(8),f(4)];}
const FIELDS = ['voronoi','warp','truchet','rings','metaballs','stripes','dots','kaleido','hex','spiral','plasma','worms'];
const MODES = ['ramp','levels','lines','halftone'];
// world = seed
function world(seed){
  const R = mulberry(seed * 9973 + 17), pick = a => a[Math.floor(R() * a.length)], rr = (a, b) => a + (b - a) * R();
  const h = R() * 360, scheme = pick(['mono', 'analogous', 'complement', 'triad', 'split']);
  const off = { mono: [0, 0], analogous: [25, 55], complement: [180, 195], triad: [120, 240], split: [150, 210] }[scheme];
  const sat = rr(.35, .85);
  const c0 = hsl(h + rr(-10, 10), rr(.2, .6), rr(.02, .085)), c1 = hsl(h, sat, rr(.16, .28)), c2 = hsl(h + off[0], sat, rr(.42, .6)), c3 = hsl(h + off[1], rr(.3, .7), rr(.78, .92));
  return {
    seed, hue: h, scheme, field: Math.floor(R() * FIELDS.length), mode: Math.floor(R() * MODES.length), c0, c1, c2, c3,
    scale: rr(.7, 1.6), speed: rr(.35, 1.3), warp: R() < .5 ? rr(0, .9) : 0, soft: rr(.3, 1), levels: 2 + Math.floor(R() * 4),
    a: R(), b: R(), c: R(), grain: rr(.015, .08), glow: rr(0, .7), vig: rr(.2, .9), t0: R() * 100
  };
}
const cv = document.createElement('canvas'); document.body.appendChild(cv);
const gl = cv.getContext('webgl', { antialias: false, preserveDrawingBuffer: true });
function sh(t, s){ const o = gl.createShader(t); gl.shaderSource(o, s); gl.compileShader(o); if (!gl.getShaderParameter(o, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(o)); return o; }
const pr = gl.createProgram(); gl.attachShader(pr, sh(gl.VERTEX_SHADER, VS)); gl.attachShader(pr, sh(gl.FRAGMENT_SHADER, FS)); gl.linkProgram(pr); gl.useProgram(pr);
const buf = gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER, buf); gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1,1,-1,-1,1,1,1]), gl.STATIC_DRAW);
const loc = gl.getAttribLocation(pr, 'a'); gl.enableVertexAttribArray(loc); gl.vertexAttribPointer(loc, 2, gl.FLOAT, false, 0, 0);
const U = {}; for (const n of ['uRes','uF','uT','uDown','uKick','uGrain','uGlow','uVig','uLevels','uWarpAmt','uScale','uSpeed','uSoft','uA','uB','uC','uField','uMode','c0','c1','c2','c3']) U[n] = gl.getUniformLocation(pr, n);
function draw(w, x, y, W, H, t, f, down, kick){
  gl.viewport(x, y, W, H); gl.scissor(x, y, W, H);
  gl.uniform2f(U.uRes, W, H); gl.uniform2f(U.uF, f[0], f[1]); gl.uniform1f(U.uT, t + w.t0); gl.uniform1f(U.uDown, down); gl.uniform1f(U.uKick, kick);
  gl.uniform1f(U.uGrain, w.grain); gl.uniform1f(U.uGlow, w.glow); gl.uniform1f(U.uVig, w.vig); gl.uniform1f(U.uLevels, w.levels); gl.uniform1f(U.uWarpAmt, w.warp);
  gl.uniform1f(U.uScale, w.scale); gl.uniform1f(U.uSpeed, w.speed); gl.uniform1f(U.uSoft, w.soft); gl.uniform1f(U.uA, w.a); gl.uniform1f(U.uB, w.b); gl.uniform1f(U.uC, w.c);
  gl.uniform1i(U.uField, w.field); gl.uniform1i(U.uMode, w.mode);
  gl.uniform3fv(U.c0, w.c0); gl.uniform3fv(U.c1, w.c1); gl.uniform3fv(U.c2, w.c2); gl.uniform3fv(U.c3, w.c3);
  gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
}
gl.enable(gl.SCISSOR_TEST);
if (SHEET) {
  document.body.classList.add('sheet');
  const cols = +(Q.get('cols') || 10), rows = +(Q.get('rows') || 5), tw = 156, th = 338, s0 = +(Q.get('from') || 1);
  const out = document.createElement('canvas'); out.width = cols * tw; out.height = rows * th; const c2 = out.getContext('2d');
  const wrap = document.createElement('div'); wrap.id = 'sheetwrap'; document.body.appendChild(wrap); wrap.appendChild(out);
  cv.style.display = 'none'; cv.width = tw; cv.height = th;
  (async () => {
    for (let i = 0; i < cols * rows; i++) {
      const w = world(s0 + i), cx = i % cols, cy = Math.floor(i / cols);
      draw(w, 0, 0, tw, th, 3.7, [.3 + .4 * ((i * .37) % 1), .35 + .3 * ((i * .61) % 1)], i % 2, .3);
      gl.finish(); c2.drawImage(cv, cx * tw, cy * th);
      const sp = document.createElement('span'); sp.textContent = (s0 + i) + ' ' + FIELDS[w.field] + '/' + MODES[w.mode]; sp.style.left = (cx * tw + 4) + 'px'; sp.style.top = (cy * th + 3) + 'px'; wrap.appendChild(sp);
      if (i % 5 === 4) await new Promise(r => setTimeout(r, 0));
    }
    window.__done = true;
  })();
} else {
  let w = world(+(Q.get('seed') || (Math.random() * 1e6 | 0))), down = 0, f = [.5, .5], kick = 0, t0 = performance.now();
  function fit(){ const d = Math.min(devicePixelRatio || 1, 2); cv.width = innerWidth * d; cv.height = innerHeight * d; }
  fit(); addEventListener('resize', fit);
  const mv = e => { f = [e.clientX / innerWidth, 1 - e.clientY / innerHeight]; };
  cv.addEventListener('pointerdown', e => { w = world((Math.random() * 1e6) | 0); t0 = performance.now(); down = 1; mv(e); kick = 1; });   // a touch is a new world
  cv.addEventListener('pointermove', e => { if (down) mv(e); });
  addEventListener('pointerup', () => { down = 0; });
  let last = performance.now();
  (function loop(n){ requestAnimationFrame(loop); const dt = (n - last) / 1000; last = n; kick *= Math.exp(-dt * 3); if (down && Math.random() < dt * 2) kick = Math.max(kick, .7);
    draw(w, 0, 0, cv.width, cv.height, (n - t0) / 1000, f, down, kick);
    document.getElementById('lab').textContent = 'seed ' + w.seed + '\n' + FIELDS[w.field] + ' / ' + MODES[w.mode] + ' / ' + w.scheme; })(performance.now());
}
</script></body></html>
